<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearline · Underwriting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens from awesome-design-md/revolut/DESIGN.md (Inter substitutes for Aeonik Pro on display sizes). */
:root {
  --primary: #494fdf; --primary-deep: #3a40c4; --on-primary: #fff;
  --ink: #191c1f; --charcoal: #3a3d40; --mute: #505a63; --stone: #8d969e; --faint: #c9c9cd;
  --canvas-light: #fff; --canvas-dark: #000; --surface-soft: #f4f4f4; --surface-elevated: #16181a;
  --hairline-light: #e2e2e7; --hairline-dark: rgba(255,255,255,.12); --on-dark-mute: rgba(255,255,255,.72);
  --teal: #00a87e; --green: #428619; --warning: #ec7e00; --yellow: #b09000; --danger: #e23b4a; --deep-red: #8b0000;
  --link: #376cd5; --hl: #fff2a8;
  --r-md: 12px; --r-lg: 20px; --r-full: 9999px;
  --display: "Inter", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font: 400 16px/1.5 var(--display); letter-spacing: .24px; background: var(--canvas-light); color: var(--ink); -webkit-font-smoothing: antialiased; }
code { font-size: 14px; background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px; }

/* nav */
header { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 32px; background: var(--canvas-dark); color: #fff; }
header h1 { font: 600 18px/1 var(--display); letter-spacing: -.2px; margin: 0; display: flex; align-items: center; gap: 10px; }
header h1::before { content: ""; width: 22px; height: 22px; border-radius: 7px; background: var(--primary); }
header .org { color: var(--on-dark-mute); font-size: 14px; }
header .spacer { flex: 1; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: var(--r-full); background: rgba(255,255,255,.1); color: var(--on-dark-mute); }
#newBtn { background: #fff; color: #000; border: 0; }

/* bands */
.band { padding: 64px 32px; }
.band.dark { background: var(--canvas-dark); color: #fff; }
.band.light { background: var(--canvas-light); }
.band.soft { background: var(--surface-soft); }
.inner { max-width: 1200px; margin: 0 auto; }
.eyebrow { display: inline-block; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: var(--r-full); background: var(--primary); color: var(--on-primary); }
.display { font: 500 40px/1.1 var(--display); letter-spacing: -.8px; margin: 12px 0 8px; }
.lede { font-size: 16px; line-height: 1.5; color: var(--on-dark-mute); max-width: 720px; margin: 0 0 24px; }
.heading { font: 500 32px/1.19 var(--display); letter-spacing: -.5px; margin: 0 0 24px; }
.muted { color: var(--mute); }
.dark .muted { color: var(--on-dark-mute); }
.small { font-size: 14px; }
h2 { font: 500 20px/1.4 var(--display); letter-spacing: -.2px; margin: 0 0 16px; color: var(--ink); }

/* buttons: pills only */
button { font: 600 14px/1.43 var(--display); letter-spacing: .16px; border: 0; background: var(--surface-soft); color: var(--ink); border-radius: var(--r-full); padding: 8px 16px; cursor: pointer; transition: background .15s; }
button:hover { background: #e9e9ec; }
button.primary { background: var(--canvas-dark); color: #fff; font-size: 16px; padding: 14px 28px; height: 48px; }
button.primary:hover { background: var(--charcoal); }
button.btn-light { background: #fff; color: #000; font-size: 16px; padding: 14px 28px; height: 48px; }
button.btn-light:hover { background: var(--faint); }
button:disabled, button.primary:disabled { background: var(--faint); color: var(--mute); cursor: not-allowed; }
button.link { background: none; padding: 0; color: var(--link); font-weight: 600; font-size: 14px; border-radius: 0; }
button.link:hover { background: none; text-decoration: underline; }

/* start */
.drop { border: 1.5px dashed var(--hairline-dark); border-radius: var(--r-lg); padding: 20px 24px; background: var(--surface-elevated); display: flex; align-items: center; gap: 24px; flex-wrap: wrap; cursor: pointer; transition: border-color .15s, background .15s; }
.drop.over, .drop:hover { border-color: #fff; background: #1d2023; }
.drop .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); display: grid; place-items: center; font-size: 26px; }
.drop .big { font: 500 20px/1.4 var(--display); }
.drop .sub { color: var(--on-dark-mute); font-size: 14px; }
.drop .grow { flex: 1; min-width: 220px; }
.queuehead { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: end; }
.kpis { display: flex; gap: 10px; }
.kpis div { background: var(--surface-elevated); border-radius: var(--r-md); padding: 12px 18px; min-width: 120px; }
.kpis b { display: block; font: 500 22px/1.2 var(--display); letter-spacing: -.3px; }
.kpis span { font-size: 12px; color: var(--on-dark-mute); }
.queue { border: 1px solid var(--hairline-light); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 16px; }
.qrow { display: grid; grid-template-columns: 1.1fr 2.2fr 1fr 1.5fr 1fr auto; gap: 16px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--hairline-light); cursor: pointer; transition: background .12s; }
.qrow:hover { background: var(--surface-soft); }
.qrow.qhead { border-top: 0; background: var(--surface-soft); cursor: default; font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; padding: 10px 20px; }
.qrow b { display: block; font-weight: 600; font-size: 15px; }
.qrow small { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); }
.qrow > span:first-child b, .qrow > span:first-child small { white-space: nowrap; }
.dotnew { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); display: inline-block; }
button.dark { background: var(--canvas-dark); color: #fff; }
button.dark:hover { background: var(--charcoal); }
.drop.light { background: var(--surface-soft); border-color: var(--hairline-light); padding: 14px 20px; color: var(--ink); }
.drop.light:hover, .drop.light.over { background: #ececef; border-color: var(--ink); }
.drop.light button { background: #fff; }
.samples { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.sample { text-align: left; padding: 24px; border-radius: var(--r-lg); background: #fff; border: 1px solid var(--hairline-light); font-weight: 400; display: flex; flex-direction: column; gap: 6px; min-height: 140px; }
.sample:hover { background: #fff; border-color: var(--ink); }
.sample b { font: 500 18px/1.35 var(--display); letter-spacing: -.1px; }
.sample span { font-size: 14px; color: var(--mute); }
.sample .count { margin-top: auto; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface-soft); border-radius: var(--r-full); padding: 4px 12px; align-self: flex-start; }

/* cards */
.card { background: #fff; border: 1px solid var(--hairline-light); border-radius: var(--r-lg); padding: 32px; margin-bottom: 16px; }
.cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }

/* upload */
.file { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hairline-light); }
.file:last-child { border-bottom: 0; }
.file > span:first-child { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-soft); display: grid; place-items: center; }
.file .name { font-weight: 600; }
.file .what { font-size: 14px; color: var(--mute); }
.bar { height: 4px; background: var(--surface-soft); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .35s; }
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { padding: 10px 0; color: var(--stone); display: flex; gap: 12px; align-items: center; }
.steps li::before { content: ""; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hairline-light); flex: none; }
.steps li.done { color: var(--ink); }
.steps li.done::before { content: "✓"; border: 0; background: var(--teal); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.steps li.now { color: var(--ink); font-weight: 600; }
.steps li.now::before { border-color: var(--primary); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* dashboard hero */
.band.slim { padding: 22px 32px; }
.band.hero { padding: 36px 32px 32px; }
.band.light.tight, .band.soft.tight { padding-top: 28px; }
.band.tight { padding-top: 28px; padding-bottom: 40px; }
.doc button.link { text-align: left; }
.card h2 .muted { font-weight: 400; }
.issues-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
.issues-grid .issue { background: var(--surface-soft); border: 0; border-radius: var(--r-md); padding: 18px 20px; display: flex; flex-direction: column; }
.issues-grid .issue p { margin: 6px 0 14px 20px; }
.issues-grid .issue .row { margin-top: auto; }
.issue .grow { flex: 1; }
.issue button { background: #fff; }
.issue button.dark { background: var(--canvas-dark); color: #fff; }
.issue button.link { background: none; }
.cardhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.cardhead h2 { margin: 0; }
.cardhead .counts { margin-right: auto; }
.docs .cardhead { margin-bottom: 0; }
.docs .attention { margin: 16px 0 0; }
.docs .docgrid { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hairline-light); }
.docs.open .docgrid { display: grid; }
.toggle { background: none; color: var(--link); padding: 4px 0; }
.toggle:hover { background: none; text-decoration: underline; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.count { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: var(--r-full); background: var(--surface-soft); }
.count.ok { color: #00795b; } .count.warn { color: #a35700; background: #fff4e5; } .count.bad { color: var(--deep-red); background: #fdeceb; }
.attention { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 10px; margin-bottom: 16px; }
.att { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--r-md); background: var(--surface-soft); }
.att.bad { background: #fdeceb; } .att.warn { background: #fff4e5; }
.att div { flex: 1; min-width: 0; }
.att b { display: block; font-size: 15px; }
.att span:not(.ic) { font-size: 13px; color: var(--mute); }
.att button { background: #fff; }
.att .ic, .docchip .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; color: #fff; background: var(--teal); }
.att .ic.bad { background: var(--danger); } .att .ic.warn { background: var(--warning); } .att .ic.muted { background: var(--stone); }
.docgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 4px 16px; }
.docchip { display: flex; align-items: center; gap: 10px; text-align: left; background: none; border-radius: var(--r-md); padding: 8px 10px; font-weight: 500; font-size: 14px; }
.docchip:hover { background: var(--surface-soft); }
.status { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; }
.status .who { color: var(--on-dark-mute); font-size: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.status .who b { color: #fff; font: 500 20px/1.3 var(--display); letter-spacing: -.2px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 18px 0 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; color: var(--on-dark-mute); }
.facts dd { margin: 2px 0 0; font: 500 18px/1.3 var(--display); letter-spacing: -.2px; color: #fff; }
.facts dd small { font: 400 13px var(--display); color: var(--on-dark-mute); margin-left: 4px; }
.state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: var(--r-full); }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.state.good { background: rgba(0,168,126,.16); color: #3fd6ad; }
.state.attn { background: rgba(236,126,0,.16); color: #ffa94d; }
.state.bad { background: rgba(226,59,74,.18); color: #ff6b78; }
.tiles { display: flex; gap: 10px; }
.tile { border-radius: var(--r-md); padding: 14px 18px; min-width: 128px; background: var(--surface-elevated); }
.tile small { display: block; font-size: 12px; color: var(--on-dark-mute); margin-bottom: 4px; }
.tile b { font: 500 26px/1 var(--display); letter-spacing: -.5px; }
.tile .lim { display: block; font-size: 12px; margin-top: 6px; color: #3fd6ad; font-weight: 600; }
.tile.over b { color: #ff6b78; }
.tile.over .lim { color: #ff6b78; }

/* issues + documents */
.issue { padding: 18px 0; border-bottom: 1px solid var(--hairline-light); }
.issue:first-of-type { padding-top: 0; }
.issue:last-child { border-bottom: 0; padding-bottom: 0; }
.issue .t { font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--warning); display: inline-block; }
.dot.refer, .dot.decline { background: var(--danger); }
.issue p { margin: 6px 0 12px 20px; font-size: 14px; color: var(--mute); }
.issue .row { margin-left: 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.issue.done { opacity: .55; }
.doc { display: flex; gap: 12px; align-items: center; padding: 8px 0; font-size: 15px; }
.doc .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; color: #fff; background: var(--teal); }
.doc .ic.warn { background: var(--warning); }
.doc .ic.bad { background: var(--danger); }
.doc .ic.muted { background: var(--faint); }
.ok { color: var(--green); } .bad { color: var(--deep-red); } .warn { color: #a35700; }

/* broker */
.msg { border: 1px solid var(--hairline-light); border-radius: var(--r-lg); margin-bottom: 12px; overflow: hidden; background: #fff; }
.msg header { height: auto; padding: 14px 20px; background: var(--surface-soft); color: var(--ink); display: flex; gap: 10px; align-items: center; font-size: 14px; flex-wrap: wrap; }
.msg pre { margin: 0; padding: 20px; white-space: pre-wrap; font: 400 15px/1.55 var(--display); }
.pill { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: var(--r-full); background: var(--primary); color: var(--on-primary); }
.pill.auto { background: var(--ink); color: #fff; }
.pill.sent { background: var(--teal); color: #fff; }
.msg.sent { border-color: var(--hairline-light); }
.msg.sent details { padding: 0 20px; }
.msg.sent details summary { font-size: 14px; padding: 10px 0; color: var(--link); }
.msg.sent details pre { padding: 0 0 16px; }
.msgfoot { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--hairline-light); flex-wrap: wrap; }
.report { padding: 4px 20px 8px; }
.rstatus { margin: 12px 0 4px; font-weight: 600; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 24px; }
.rsec { padding: 14px 0; border-top: 1px solid var(--hairline-light); }
.rsec h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
.rsec p { margin: 0 0 6px; }
.rsec table td { border: 0; padding: 4px 8px 4px 0; }
.rsec table td:first-child { color: var(--mute); width: 38%; }
.rsec b.ok { color: #00795b; } .rsec b.over { color: var(--deep-red); }
.rsec ol { margin: 0; padding-left: 20px; } .rsec ol li { padding: 4px 0; }
.rsec .cond:first-of-type { padding-top: 0; }
.email { margin-top: 16px; border: 1px solid var(--hairline-light); border-radius: var(--r-md); overflow: hidden; }
.ehead { background: var(--surface-soft); padding: 12px 18px; font-size: 14px; }
.ehead div { padding: 3px 0; display: flex; gap: 12px; }
.ehead span { width: 64px; flex: none; color: var(--mute); }
.email pre { margin: 0; padding: 18px; max-height: 52vh; overflow: auto; white-space: pre-wrap; font: 400 14px/1.55 ui-monospace, "SF Mono", Menlo, monospace; }
.toast { position: fixed; right: 24px; bottom: 24px; z-index: 50; background: var(--canvas-dark); color: #fff; font-weight: 600; font-size: 15px;
  padding: 14px 22px; border-radius: var(--r-full); box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transform: translateY(12px); transition: .25s; }
.toast.show { opacity: 1; transform: none; }
.cond { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hairline-light); font-size: 15px; }
.cond:last-child { border-bottom: 0; }
.cond .x { margin-left: auto; white-space: nowrap; }
.cond.off span { text-decoration: line-through; color: var(--stone); }
.sendbar { display: flex; gap: 16px; align-items: center; justify-content: space-between; margin-top: 20px; flex-wrap: wrap; }
details summary { cursor: pointer; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 10px 4px; border-bottom: 1px solid var(--hairline-light); vertical-align: top; }
.log { font-size: 14px; }
.log div { padding: 6px 0; border-bottom: 1px solid var(--hairline-light); }

/* dialogs */
dialog { border: 0; border-radius: var(--r-lg); background: #fff; color: var(--ink); padding: 0; width: min(980px, calc(100vw - 32px)); }
dialog.narrow { width: min(480px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog .body { padding: 32px; }
dialog h3 { font: 500 24px/1.33 var(--display); margin: 0 0 4px; }
.viewer { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 20px; }
.viewer iframe, .viewer img { width: 100%; height: 540px; border: 1px solid var(--hairline-light); border-radius: var(--r-md); object-fit: contain; background: var(--surface-soft); }
.field { padding: 8px 10px; border-radius: var(--r-md); font-size: 14px; }
.field.hl { background: var(--hl); }
label { display: block; font-size: 14px; color: var(--mute); margin: 14px 0 6px; }
select, input, textarea { font: inherit; width: 100%; padding: 14px 16px; border: 1px solid var(--hairline-light); border-radius: var(--r-md); background: #fff; color: var(--ink); }

@media (max-width: 820px) {
  .band { padding: 40px 16px; }
  header { padding: 0 16px; }
  header .org, .tag { display: none; }
  .display { font-size: 30px; letter-spacing: -.5px; }
  .queuehead { grid-template-columns: 1fr; }
  .kpis div { min-width: 0; flex: 1; padding: 10px 12px; }
  .qrow { grid-template-columns: 1fr auto; gap: 4px 12px; }
  .qrow.qhead { display: none; }
  .qrow > span:nth-child(2), .qrow > span:nth-child(4) { grid-column: 1 / -1; }
  .qrow > span:nth-child(5) { display: none; }
  .band.hero { padding: 24px 16px; }
  .band.slim { padding: 24px 16px; }
  .status { grid-template-columns: 1fr; gap: 16px; }
  .facts { gap: 8px 20px; }
  .facts dd { font-size: 16px; }
  .cols, .viewer, .issues-grid, .attention { grid-template-columns: 1fr; }
  .card, dialog .body { padding: 20px; }
  .tile { min-width: 0; flex: 1; padding: 16px; }
  .tile b { font-size: 22px; }
  .viewer iframe, .viewer img { height: 360px; }
}
</style>
</head>
<body>
<header>
  <h1>Clearline</h1><span class="org">Underwriting agent · Maple Ridge Mortgage Co.</span>
  <span class="spacer"></span><span class="tag">Synthetic data · prototype</span>
  <button id="newBtn" onclick="startScreen()" hidden>New file</button>
</header>
<main id="app"></main>
<input type="file" id="picker" multiple hidden>
<dialog id="dlg"><div class="body" id="dlgBody"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => "$" + Number(v).toLocaleString("en-CA", {maximumFractionDigits: 0});
const sleep = ms => new Promise(r => setTimeout(r, ms));
let view = null, batch = null, samples = [], docsOpen = false;

async function api(path, body) {
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
    headers: body === undefined ? {} : {"Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await r.json();
  if (!r.ok) { alert(data.detail || "Something went wrong"); throw new Error(data.detail); }
  return data;
}

/* ---------- 1. start: applications that arrived from the broker POS ---------- */
const ago = m => m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} hr ${m % 60} min ago`;
async function startScreen() {
  $("#newBtn").hidden = true; view = null;
  samples = samples.length ? samples : await api("/api/samples");
  const rows = [...samples].sort((x, y) => x.pos.received_min_ago - y.pos.received_min_ago);
  $("#app").innerHTML = `
    <section class="band dark hero"><div class="inner queuehead">
      <div><span class="eyebrow">Inbox · from broker POS</span>
        <h1 class="display">${rows.length} new applications</h1>
        <p class="lede" style="margin:0">Submitted by brokers through the point-of-sale system. Open one and the agent reads every document, checks it against policy and drafts the broker's conditions.</p></div>
      <div class="kpis"><div><b>${rows.length}</b><span>Waiting</span></div><div><b>${ago(rows[0].pos.received_min_ago).replace(" ago", "")}</b><span>Newest</span></div>
        <div><b>${money(rows.reduce((t, r) => t + Number(r.loan_amount), 0))}</b><span>In the queue</span></div></div>
    </div></section>
    <section class="band light tight"><div class="inner">
      <div class="queue" role="table" aria-label="Incoming applications">
        <div class="qrow qhead" role="row"><span>Application</span><span>Borrower · property</span><span>Loan</span><span>Broker</span><span>Received</span><span></span></div>
        ${rows.map(r => `<div class="qrow" role="row" onclick="sendSample('${r.id}')">
          <span><b>${esc(r.pos.app_no)}</b><small><span class="dotnew"></span>New · ${r.files.length} docs</small></span>
          <span><b>${esc(r.borrowers.join(" & "))}</b><small>${esc(r.address)} · ${esc(r.income_type)}</small></span>
          <span><b>${money(r.loan_amount)}</b><small>of ${money(r.purchase_price)}</small></span>
          <span><b>${esc(r.pos.broker)}</b><small>${esc(r.pos.brokerage)}</small></span>
          <span><small>${ago(r.pos.received_min_ago)}</small></span>
          <span><button class="dark" onclick="event.stopPropagation(); sendSample('${r.id}')">Start review</button></span></div>`).join("")}
      </div>
      <div class="drop light" id="drop" onclick="$('#picker').click()">
        <div class="grow"><b>Not in the inbox?</b> <span class="muted">Drop documents here or choose files to start a review manually.</span></div>
        <button type="button">Choose files</button>
      </div>
    </div></section>`;
  const drop = $("#drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); uploadFiles([...e.dataTransfer.files]); };
}
$("#picker").onchange = e => { uploadFiles([...e.target.files]); e.target.value = ""; };

async function sendSample(id) {
  const s = samples.find(x => x.id === id);
  const files = await Promise.all(s.files.map(async name => {
    const blob = await (await fetch(`/samples/${id}/${encodeURIComponent(name)}`)).blob();
    return new File([blob], name, {type: blob.type});
  }));
  uploadFiles(files, s.pos);
}

/* ---------- 2. upload with progress, then the agent works ---------- */
function sendFile(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(), form = new FormData();
    form.append("file", file);
    xhr.open("POST", `/api/uploads/${batch}/files`);
    xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => xhr.status < 300 ? resolve(JSON.parse(xhr.responseText)) : reject(JSON.parse(xhr.responseText).detail);
    xhr.onerror = () => reject("Upload failed");
    xhr.send(form);
  });
}

async function uploadFiles(files, pos) {
  if (!files.length) return;
  $("#newBtn").hidden = false;
  batch = (await api("/api/uploads", {})).batch_id;
  $("#app").innerHTML = `<section class="band dark slim"><div class="inner">
    <div class="who" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="eyebrow">${pos ? "Importing from POS" : "Receiving files"}</span>
    <b style="font:500 22px/1.3 var(--display)">${pos ? `${esc(pos.app_no)} · ` : ""}${files.length} documents</b><span class="muted small">${pos ? `Submitted by ${esc(pos.broker)}, ${esc(pos.brokerage)}` : "Each file is uploaded, identified and handed to the agent."}</span></div></div></section>
    <section class="band soft tight"><div class="inner"><div class="cols">
    <div class="card"><h2>Files</h2><div id="files">${files.map((f, i) => `
      <div class="file" id="f${i}"><span>📄</span><div><div class="name">${esc(f.name)}</div>
      <div class="what">Waiting…</div><div class="bar"><i></i></div></div><span class="muted small">${Math.max(1, Math.round(f.size / 1024))} KB</span></div>`).join("")}</div></div>
    <div class="card"><h2>Agent</h2><ul class="steps" id="steps"><li class="now">Waiting for files…</li></ul></div></div></div></section>`;
  for (const [i, f] of files.entries()) {
    const row = $(`#f${i}`), what = $(".what", row), bar = $(".bar i", row);
    what.textContent = "Uploading…";
    try {
      const res = await sendFile(f, p => bar.style.width = `${Math.round(p * 100)}%`);
      bar.style.width = "100%"; await sleep(350);  // local uploads are instant; slow down so the step is visible
      what.innerHTML = res.recognized
        ? `<span class="ok">✓ Uploaded</span> · Identified as ${esc(res.documents.map(d => d.label).join(", "))}`
        : `<span class="warn">Uploaded · not recognized</span> (this prototype can only read its sample files)`;
    } catch (err) { what.innerHTML = `<span class="bad">✗ ${esc(err)}</span>`; }
  }
  await agentWorks();
}

async function agentWorks() {
  const steps = ["Sorting and reading documents", "Checking what's missing", "Verifying income", "Tracing deposits and down payment",
                 "Comparing debts with the credit report", "Calculating ratios against policy", "Drafting conditions and broker request"];
  const ul = $("#steps");
  let data;
  try { data = api(`/api/uploads/${batch}/review`, {}); } catch { return; }
  for (const [i, s] of steps.entries()) {
    ul.innerHTML = steps.slice(0, i + 1).map((x, j) => `<li class="${j < i ? "done" : "now"}">${x}</li>`).join("");
    await sleep(450);
  }
  try { view = await data; } catch { ul.innerHTML += `<li class="bad">Review couldn't start.</li>`; return; }
  ul.innerHTML = steps.map(x => `<li class="done">${x}</li>`).join("");
  await sleep(400);
  render();
}

/* ---------- 3. dashboard ---------- */
function headline(v) {
  const open = v.flags.filter(f => !f.dismissed);
  const needs = v.conditions.filter(c => c.raised_by && c.raised_by !== "tds_limit" && c.raised_by !== "gds_limit").length;
  if (v.recommendation === "decline") return ["bad", "Outside policy", "Beyond the exception margin"];
  if (v.recommendation === "refer_for_review") { const n = open.filter(f => f.severity !== "condition").length;
    return ["attn", `Needs your judgment on ${n} issue${n === 1 ? "" : "s"}`, "Refer for review"]; }
  if (v.recommendation === "approve_with_conditions") return ["attn", `Needs ${needs} thing${needs === 1 ? "" : "s"} from the broker`, "Within policy, with conditions"];
  return ["good", "Ready to approve", "Everything checks out"];
}

function render() {
  const v = view, rv = v.review, r = v.ratios, a = v.application;
  const [tone, title, sub] = headline(v);
  const tile = (label, val, limit) => { const over = Number(val) > limit;
    return `<div class="tile ${over ? "over" : ""}"><small>${label}</small><b>${val}%</b><span class="lim">${over ? "Over" : "Within"} ${limit}% limit</span></div>`; };
  const missing = v.flags.filter(f => f.check === "missing_document");
  const issues = v.flags.filter(f => f.check !== "missing_document" && f.check !== "low_confidence");

  const issueHtml = issues.length ? `<div class="issues-grid">${issues.map(f => {
    const done = rv.flag_reviews[f.id];
    const ev = f.evidence.find(e => e.doc_id);
    return `<div class="issue ${done ? "done" : ""}"><div class="t"><span class="dot ${f.severity}"></span>${esc(f.title)}</div>
      <p>${esc(f.detail)}</p>
      <div class="row">${ev ? `<button class="link" onclick="openDoc('${ev.doc_id}','${esc(ev.field)}')">View source →</button>` : ""}
      <span class="grow"></span>
      ${done ? `<span class="small muted">${done.action === "reject" ? "Marked not an issue" : done.action === "escalate" ? `Escalated to ${esc(f.escalate_to)}` : "✓ Confirmed"}</span>
        ${rv.approved ? "" : `<button class="link" onclick="act({kind:'flag',target:'${esc(f.id)}',action:'undo'})">undo</button>`}`
      : `${f.escalate_to ? `<button onclick="act({kind:'flag',target:'${esc(f.id)}',action:'escalate'})">Escalate</button>` : ""}
         <button onclick="notIssue('${esc(f.id)}')">Not an issue</button>
         <button class="dark" onclick="act({kind:'flag',target:'${esc(f.id)}',action:'confirm'})">✓ Confirm</button>`}</div></div>`;
  }).join("")}</div>` : `<p class="muted" style="margin:0">No issues found. Income, deposits, debts and documents all line up.</p>`;

  const lowDocs = v.documents.filter(d => d.confidence < 0.8 && !rv.confirmed_docs.includes(d.id));
  const unknown = v.uploads.filter(u => !u.recognized);
  const sentConds = new Set(rv.messages.flatMap(m => m.condition_ids));
  const asked = flagId => v.conditions.some(c => c.flag_id === flagId && sentConds.has(c.id));
  const attention = missing.map(f => `<div class="att bad"><span class="ic bad">✗</span><div><b>${esc(f.title.replace("Missing document: ", ""))}</b>
        <span>Missing · ${asked(f.id) ? "requested from broker" : "in the draft request below"}</span></div></div>`).join("")
    + lowDocs.map(d => `<div class="att warn"><span class="ic warn">!</span><div><b>${esc(d.label)}</b><span>Hard to read · ${asked(`low_confidence:${d.id}`) ? "clearer copy requested" : "clearer copy in the draft request"}</span></div>
        ${rv.approved ? "" : `<button onclick="openDoc('${d.id}',null,true)">Check & confirm</button>`}</div>`).join("")
    + unknown.map(u => `<div class="att"><span class="ic muted">?</span><div><b>${esc(u.filename)}</b><span>${esc(u.note || "Not recognized")}</span></div></div>`).join("");
  const received = v.documents.filter(d => !lowDocs.includes(d)).map(d =>
    `<button class="docchip" onclick="openDoc('${d.id}')"><span class="ic">✓</span>${esc(d.label)}</button>`).join("");
  const counts = [`<span class="count ok">✓ ${v.documents.length - lowDocs.length} received</span>`,
    lowDocs.length ? `<span class="count warn">! ${lowDocs.length} hard to read</span>` : "",
    missing.length ? `<span class="count bad">✗ ${missing.length} missing</span>` : ""].join("");
  const docsHtml = `${attention ? `<div class="attention">${attention}</div>` : ""}<div class="docgrid">${received}</div>`;
  const aps = v.documents.find(d => d.type === "purchase_agreement")?.fields || {};
  const L = a.loan, P = a.property;
  const fmtDate = dt => dt ? new Date(dt + "T12:00").toLocaleDateString("en-CA", {month: "short", day: "numeric", year: "numeric"}) : "Not provided";
  const facts = [["Loan amount", money(L.amount)], ["Purchase price", money(P.purchase_price)],
    ["Down payment", money(L.down_payment), `${Math.round(L.down_payment / P.purchase_price * 100)}%`],
    ["Closing date", fmtDate(aps.closing_date)], ["Rate", `${L.contract_rate}%`, `qualifies at ${r.qualifying_rate}%`],
    ["Term · amortization", `${L.term_years} yr · ${L.amortization_years} yr`, esc(L.product)]];

  const kindLabel = k => k === "document_request" ? "Document request" : "Review report & conditions";
  const msgs = rv.messages.map(m => `<div class="msg sent"><header><span class="pill sent">✓ Sent</span><b>${kindLabel(m.kind)}</b>
      <span class="muted">${esc(m.subject)}</span><span style="flex:1"></span><span class="muted">${esc(m.at.slice(11, 16))}</span></header>
      <details><summary>${m.report ? "Show report" : "Show message"}</summary>${m.report
        ? `<div class="report">${reportStatus(m.status)}${reportSections(m.report)}${reportConditions(m.report)}</div>` : `<pre>${esc(m.body)}</pre>`}</details></div>`).join("");
  const req = rv.request_draft && !rv.approved ? `<div class="msg"><header><span class="pill">Draft</span><b>Document request</b>
      <span class="muted">${esc(rv.request_draft.subject)}</span></header><pre>${esc(rv.request_draft.body)}</pre>
      <div class="msgfoot"><span class="muted small">Plain document request. Can go now, before you finish reviewing.</span>
      <button class="primary" onclick="previewMsg('send_request')">Preview & send</button></div></div>` : "";
  const conds = group => v.conditions.filter(c => group === "approval" ? c.raised_by : !c.raised_by).map(c => {
    const cr = rv.condition_reviews[c.id] || {};
    const text = cr.action === "edit" ? cr.text : c.text;
    return `<div class="cond ${cr.action === "reject" ? "off" : ""}"><span>${esc(text)}</span>
      ${rv.approved ? "" : `<span class="x">${cr.action === "reject" ? `<button class="link" onclick="act({kind:'condition',target:'${c.id}',action:'accept'})">restore</button>`
        : `<button class="link" onclick="condEdit('${c.id}')">edit</button> · <button class="link" onclick="condRemove('${c.id}')">remove</button>`}</span>`}</div>`;
  }).join("");

  $("#app").innerHTML = `
  <section class="band dark slim"><div class="inner status">
    <div><div class="who"><b>${esc(a.borrowers.map(b => b.name).join(" & "))}</b><span>${esc(a.property.address)}</span>
        <span class="state ${tone}">${esc(title)}</span></div>
      <dl class="facts">${facts.map(([k, val, note]) => `<div><dt>${k}</dt><dd>${val}${note ? `<small>${note}</small>` : ""}</dd></div>`).join("")}</dl></div>
    <div class="tiles">${tile("GDS", r.gds_qualifying, v.limits.gds)}${tile("TDS", r.tds_qualifying, v.limits.tds)}${tile("LTV", r.ltv, 80)}</div>
  </div></section>
  <section class="band soft tight"><div class="inner">
  <div class="card"><h2>Issues to review <span class="muted">· ${issues.length}</span></h2>${issueHtml}</div>
  <div class="card docs ${docsOpen ? "open" : ""}"><div class="cardhead"><h2>Documents</h2><div class="counts">${counts}</div>
    <button class="toggle" onclick="docsOpen = !docsOpen; this.closest('.docs').classList.toggle('open'); this.textContent = docsOpen ? 'Hide received ▴' : 'Show received ▾'">${docsOpen ? "Hide received ▴" : "Show received ▾"}</button></div>${docsHtml}</div>
  <div class="card"><h2>Broker messages</h2>${req}
    ${rv.approved ? "" : `<div class="msg"><header><span class="pill">Draft</span><b>Review report & conditions</b><span class="muted">${esc(rv.draft.subject)}</span></header>
      <div class="report">${reportStatus(rv.draft.status)}${reportSections(rv.draft.report)}
        <div class="rsec wide"><h4>Conditions before approval</h4>${conds("approval") || `<p class="muted small">None. Only the standard conditions below remain.</p>`}</div>
        <div class="rsec wide"><h4>Conditions before funding</h4>${conds("funding")}</div></div>
      <div class="msgfoot"><span class="${rv.blockers.length ? "warn" : "muted"} small">${rv.blockers.length ? "Before sending: " + rv.blockers.map(esc).join(" and ") : "Drafted by the agent. Nothing goes out until you click Send."}</span>
      <button class="primary" ${rv.blockers.length ? "disabled" : ""} onclick="previewMsg('approve')">Preview & send</button></div></div>`}
    ${msgs}
  </div>
  <div class="card"><details><summary>Details: figures used, agent steps, audit trail</summary>
    <h2 style="margin-top:14px">Figures used in the ratios</h2>
    <table>${v.inputs.map(i => `<tr><td>${esc(i.label)}<div class="muted">${esc(i.basis)}${i.override ? ` · changed from ${money(i.agent_value)}: ${esc(i.override.reason)}` : ""}</div></td>
      <td style="white-space:nowrap">${money(i.value)}</td><td>${rv.approved ? "" : `<button class="link" onclick="editInput('${esc(i.key)}','${esc(i.label)}','${i.value}')">edit</button>`}</td></tr>`).join("")}</table>
    ${v.comparison ? `<p class="small muted">${esc(v.comparison.label)}: GDS ${v.comparison.gds}%, TDS ${v.comparison.tds}%</p>` : ""}
    <h2 style="margin-top:14px">What the agent did</h2><ol class="small">${v.steps.map(s => `<li>${esc(s.text)}${s.detail ? ` <span class="muted">– ${esc(s.detail)}</span>` : ""}</li>`).join("")}</ol>
    <h2 style="margin-top:14px">Audit trail</h2><div class="log">${rv.audit.map(x => `<div><span class="muted">${esc(x.at.slice(11))}</span> <b>${esc(x.who)}</b> ${esc(x.text)}</div>`).join("")}</div>
    <p class="small muted">Policy: ${v.policy_versions.map(p => esc(p.file) + " v" + esc(p.version)).join(", ")}</p>
  </details></div></div></section>`;
}

/* ---------- actions ---------- */
/* broker report: same structure the email is built from */
function reportStatus(status) { return `<div class="rstatus">${esc(status)}</div>`; }
function reportSections(report) {
  return `<div class="rgrid">${report.filter(sec => sec.rows).map(sec => `<div class="rsec"><h4>${esc(sec.title)}</h4>
    ${sec.note ? `<p class="muted small">${esc(sec.note)}</p>` : ""}
    <table>${sec.rows.map(row => `<tr><td>${esc(row.label)}</td><td><b class="${row.status || ""}">${esc(row.value)}${row.status === "ok" ? " ✓" : row.status === "over" ? " ✗" : ""}</b>
      ${row.note ? `<div class="muted small">${esc(row.note)}</div>` : ""}</td></tr>`).join("")}</table></div>`).join("")}</div>`;
}
function reportConditions(report) {
  return report.filter(sec => sec.items).map(sec => `<div class="rsec wide"><h4>${esc(sec.title)}</h4>${sec.items.length
    ? `<ol>${sec.items.map(i => `<li>${esc(i.text)}${i.requested_earlier ? ` <span class="muted small">(requested earlier)</span>` : ""}</li>`).join("")}</ol>`
    : `<p class="muted small">${esc(sec.empty || "None.")}</p>`}</div>`).join("");
}

async function act(body) { view = await api(`/api/uploads/${batch}/action`, body); render(); }

function previewMsg(kind) {
  const m = kind === "send_request" ? view.review.request_draft : view.review.draft;
  const label = kind === "send_request" ? "Document request" : "Review report & conditions";
  const d = $("#dlg"); d.className = "";
  $("#dlgBody").innerHTML = `<h3>Preview: ${label}</h3><p class="muted small" style="margin:0">This is exactly what the broker will receive.</p>
    <div class="email">
      <div class="ehead"><div><span>From</span>${esc(m.from)}</div><div><span>To</span>${esc(m.to)}</div><div><span>Subject</span><b>${esc(m.subject)}</b></div></div>
      <pre>${esc(m.body)}</pre>
    </div>
    <div class="sendbar"><span class="muted small">${m.condition_ids.length} item${m.condition_ids.length === 1 ? "" : "s"} · sent to the simulated broker inbox</span>
      <span><button id="pBack">Back to edit</button> <button class="primary" id="pSend">Send</button></span></div>`;
  d.showModal();
  $("#pBack").onclick = () => d.close();
  $("#pSend").onclick = async () => {
    const btn = $("#pSend"); btn.disabled = true; btn.textContent = "Sending…";
    try { await act({kind}); } catch { btn.disabled = false; btn.textContent = "Send"; return; }
    d.close();
    toast(`✓ ${label} sent to ${m.to.split(" <")[0]}`);
  };
}

function toast(text) {
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3200);
}

function ask(title, {value, multiline, needsValue} = {}) {
  return new Promise(resolve => {
    const d = $("#dlg"); d.className = "narrow";
    $("#dlgBody").innerHTML = `<h3>${esc(title)}</h3>
      ${needsValue ? `<label>New value</label>${multiline ? `<textarea id="dv" rows="4">${esc(value)}</textarea>` : `<input id="dv" value="${esc(value)}">`}` : ""}
      <label>Reason (saved to the audit trail)</label><select id="dr">${view.review.reason_codes.map(c => `<option>${esc(c)}</option>`).join("")}</select>
      <label>Note (optional)</label><input id="dn">
      <div class="sendbar"><span></span><span><button id="dc">Cancel</button> <button class="primary" id="dk">Save</button></span></div>`;
    d.showModal();
    $("#dc").onclick = () => { d.close(); resolve(null); };
    $("#dk").onclick = () => { const n = $("#dn").value.trim(); d.close();
      resolve({value: needsValue ? $("#dv").value : null, reason: $("#dr").value + (n ? ": " + n : "")}); };
  });
}
async function notIssue(id) { const a = await ask("Not an issue"); if (a) act({kind: "flag", target: id, action: "reject", reason: a.reason}); }
async function editInput(key, label, value) {
  const a = await ask(`Edit: ${label}`, {value, needsValue: true});
  if (a) act({kind: "override", target: key, value: a.value.replace(/[$,\s]/g, ""), reason: a.reason});
}
async function condRemove(id) { const a = await ask("Remove this condition"); if (a) act({kind: "condition", target: id, action: "reject", reason: a.reason}); }
async function condEdit(id) {
  const c = view.conditions.find(x => x.id === id), cr = view.review.condition_reviews[id];
  const a = await ask("Edit condition", {value: cr?.text || c.text, multiline: true, needsValue: true});
  if (a) act({kind: "condition", target: id, action: "edit", value: a.value, reason: a.reason});
}

function openDoc(id, field, confirming) {
  const d = view.documents.find(x => x.id === id);
  const src = `/samples/${view.case_id}/${encodeURIComponent(d.filename)}`;
  const isImg = /\.(jpe?g|png)$/i.test(d.filename);
  const fields = Object.entries(d.fields).map(([k, v]) => {
    const val = Array.isArray(v) ? v.map(x => typeof x === "object" ? Object.values(x).join(" · ") : x).join("<br>")
      : typeof v === "object" ? Object.entries(v).map(([p, q]) => `${esc(p)}: ${esc(q)}`).join("<br>") : esc(v);
    return `<div class="field ${k === field ? "hl" : ""}"><b>${esc(k.replace(/_/g, " "))}</b><br>${val}</div>`;
  }).join("");
  const dlg = $("#dlg"); dlg.className = "";
  $("#dlgBody").innerHTML = `<h3>${esc(d.label)}</h3><div class="muted small">${esc(d.filename)} · page ${d.page} · read with ${Math.round(d.confidence * 100)}% confidence${d.quality_note ? " · " + esc(d.quality_note) : ""}</div>
    <div class="viewer">${isImg ? `<img src="${src}" alt="${esc(d.label)}">` : `<iframe src="${src}#page=${d.page}" title="${esc(d.label)}"></iframe>`}
      <div><h2>What the agent read</h2>${fields}${field === "pdf_metadata" && d.pdf_metadata ? `<div class="field hl"><b>file metadata</b><br>${esc(d.pdf_metadata.producer)}, edited ${esc(d.pdf_metadata.modified)}</div>` : ""}
      ${d.hidden_text ? `<div class="field ${field === "hidden_text" ? "hl" : ""}"><b>hidden text (invisible on the page)</b><br>${esc(d.hidden_text)}</div>` : ""}</div></div>
    <div class="sendbar"><span></span><span>${confirming ? `<button class="primary" id="dok">Values match the document</button> ` : ""}<button id="dx">Close</button></span></div>`;
  dlg.showModal();
  $("#dx").onclick = () => dlg.close();
  if (confirming) $("#dok").onclick = async () => {
dlg.close(); act({kind: "confirm_doc", target: id}); };
}

startScreen();
</script>
