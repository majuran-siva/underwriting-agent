<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearline · Underwriting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&display=swap" rel="stylesheet">
<style>
/* Tokens from awesome-design-md/mercury/DESIGN.md. Inter at light weights (350–480) substitutes arcadia.
   Night nav and dark hero bands, pale canvas, lavender cards, one indigo action pill, translucent
   indigo-tinted secondary pills, 12px cards. Mercury defines no status colours, so muted red / amber /
   green are added for critical, outstanding and done. */
:root {
  --primary: #5266eb; --primary-tint: rgba(82,102,235,.1); --primary-tint-2: rgba(82,102,235,.18); --periwinkle: #9cb4e8;
  --ink: #28253b; --ink-active: #1e1e2a; --body: #28253b; --muted: #554e7b; --hairline: #e6e5ef; --border-strong: #c3c3cc;
  --canvas: #fbfcfd; --card: #ffffff; --surface-soft: #fbfbff; --surface-card: #edecfb; --surface-strong: #e2e0f6;
  --dark: #171721; --dark-2: #1e1e2a; --on-dark: #ededf3; --fog: #c3c3cc; --slate: #70707d;
  --coral: #d9475c; --coral-soft: #fbeaed; --coral-line: #f1c2ca;
  --lavender: #edecfb; --mint: #d6efe2; --ochre: #c98a1b; --ochre-soft: #fbf1dc; --mustard: #c98a1b;
  --cream: var(--surface-card); --yellow: var(--ochre);
  --link: #5266eb; --info-border: #5266eb; --success: #1f7a55; --success-bg: #e3f4ec; --success-border: #2fae78; --hl: #fff2a8;
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 32px; --r-xl: 16px;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font: 380 15px/1.45 var(--sans); background: var(--canvas); color: var(--body); -webkit-font-smoothing: antialiased; }
b, strong { font-weight: 480; color: var(--ink); }
code { font-size: 13px; background: var(--surface-soft); padding: 1px 6px; border-radius: var(--r-xs); }

/* nav */
header { height: 72px; display: flex; align-items: center; gap: 14px; padding: 0 48px; background: var(--dark); border-bottom: 0; position: sticky; top: 0; z-index: 10; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; flex: none; }
.brand h1 { font: 480 19px/1 var(--sans); letter-spacing: .2px; color: var(--on-dark); margin: 0; }
.brand small { display: block; font: 500 11px/1 var(--sans); letter-spacing: .28px; text-transform: uppercase; color: var(--fog); margin-top: 5px; }
header .spacer { flex: 1; }
.tag { font: 420 13px/1 var(--sans); color: var(--on-dark); padding: 9px 16px; border-radius: 40px; background: rgba(156,180,232,.2); border: 0; }

/* sections: white canvas, one signature surface per screen */
.band { padding: 32px 48px; }
.band.block { margin: 20px 48px 0; border-radius: var(--r-xl); padding: 36px 40px; }
.band.lavender { background: var(--lavender); }
.band.night { background: var(--dark-2); color: var(--on-dark); }
.band.night b, .band.night strong { color: var(--on-dark); }
.band.night .display { color: var(--on-dark); }
.band.night .lede { color: var(--fog); }
.band.night .kpis div { background: rgba(237,237,243,.06); border: 1px solid rgba(237,237,243,.1); }
.band.night .kpis span { color: var(--fog); }
.band.slim { padding: 22px 32px; }
.band.tight { padding-top: 20px; padding-bottom: 48px; }
.inner { max-width: 1280px; margin: 0 auto; }
.display { font: 480 42px/1.15 var(--sans); color: var(--ink); letter-spacing: .42px; margin: 0 0 8px; }
.lede { font: 360 18px/1.35 var(--sans); margin: 0; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
h2 { font: 480 24px/1.2 var(--sans); color: var(--ink); letter-spacing: .3px; margin: 0 0 16px; }

/* buttons: near-black primary + white outlined secondary, 12px radius */
button { font: 420 14px/1.4 var(--sans); color: var(--ink); background: var(--primary-tint); border: 0; border-radius: var(--r-lg); padding: 8px 16px; cursor: pointer; }
button:active { background: var(--primary-tint-2); }
button.primary, button.dark { background: var(--primary); color: #fff; }
button.primary { font-size: 15px; padding: 0 20px; height: 40px; }
button.primary:active, button.dark:active { background: #4255d6; }
button:disabled, button.primary:disabled { background: var(--surface-strong); color: #9b98b5; cursor: not-allowed; }
button.link { background: none; border: 0; padding: 0; color: var(--link); font-weight: 480; border-radius: 0; }
button.link:active { color: #1a3866; background: none; }
.small-btn { font-size: 13px; padding: 0 14px; height: 32px; }
#newBtn { background: var(--primary); color: #fff; }

/* inbox */
.queuehead { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: end; }
.kpis { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.kpis div { background: var(--card); border-radius: var(--r-md); padding: 12px 18px; min-width: 130px; }
.kpis b { display: block; font: 480 26px/1.2 var(--sans); letter-spacing: .3px; white-space: nowrap; }
.kpis span { font: 500 13px/1.3 var(--sans); color: var(--muted); white-space: nowrap; }
.listbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.seg { display: flex; gap: 6px; }
.queue { border: 1px solid var(--hairline); border-radius: var(--r-md); overflow: hidden; margin-bottom: 16px; background: var(--card); }
.queue.over { outline: 2px solid var(--info-border); outline-offset: 3px; }
.qrow { display: grid; grid-template-columns: 1.1fr .8fr 2.2fr 1fr 1.5fr 1fr 150px; gap: 16px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--hairline); cursor: pointer; }
.qrow:active { background: var(--surface-soft); }
.qrow.static { cursor: default; }
.qrow.qhead { border-top: 0; cursor: default; background: var(--surface-soft); font: 500 12px/1 var(--sans); letter-spacing: .28px; text-transform: uppercase; color: var(--muted); padding: 14px 20px; }
.qrow > span:last-child { justify-self: end; }
.qrow b { display: block; font-size: 15px; }
.qrow small { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.qrow > span:first-child b, .qrow > span:first-child small { white-space: nowrap; }
.rowbtn { padding: 0 16px; height: 36px; }
.qrow:hover .rowbtn { background: var(--primary); color: #fff; }
.dotnew { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); display: inline-block; }
.src, .outcome { font: 420 12px/1 var(--sans); padding: 6px 10px; border-radius: 40px; background: var(--lavender); border: 0; color: var(--ink); white-space: nowrap; }
.outcome.o-ok { background: var(--success-bg); border-color: var(--mint); } .outcome.o-attn { background: var(--cream); border-color: #ecd58f; }
.outcome.o-bad { background: var(--coral); border-color: var(--coral); color: #fff; }
.dropnote { padding: 12px 20px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--hairline); text-align: center; background: var(--surface-soft); }

/* cards */
.card { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 24px; margin-bottom: 16px; }
.cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.cardhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.cardhead h2 { margin: 0; }
.cardhead .counts { margin-right: auto; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }
.count { font: 420 12px/1 var(--sans); padding: 6px 10px; border-radius: 40px; background: var(--surface-soft); border: 1px solid var(--hairline); color: var(--ink); }
.count.ok { background: var(--success-bg); border-color: var(--mint); } .count.warn { background: var(--ochre-soft); border-color: var(--yellow); }
.count.bad { background: var(--coral-soft); border-color: var(--coral-line); color: var(--coral); }

/* upload */
.file { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
.file:last-child { border-bottom: 0; }
.file > span:first-child { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--surface-soft); border: 1px solid var(--hairline); display: grid; place-items: center; }
.file .name { font-weight: 500; color: var(--ink); }
.file .what { font-size: 14px; }
.bar { height: 4px; background: var(--surface-strong); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .35s; }
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { padding: 9px 0; color: var(--border-strong); display: flex; gap: 12px; align-items: center; }
.steps li::before { content: ""; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--surface-strong); flex: none; }
.steps li.done { color: var(--ink); }
.steps li.done::before { content: "✓"; border: 0; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.steps li.now { color: var(--ink); font-weight: 500; }
.steps li.now::before { border-color: var(--ink); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* dashboard: dark navy signature card */
.status { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; }
.status .who { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 15px; color: var(--fog); }
.status .who b { font: 480 28px/1.2 var(--sans); letter-spacing: .42px; color: var(--on-dark); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 16px 0 0; }
.facts dt { font: 500 11px/1 var(--sans); letter-spacing: .28px; text-transform: uppercase; color: var(--fog); }
.facts dd { margin: 6px 0 0; font: 480 18px/1.3 var(--sans); color: var(--on-dark); }
.facts dd small { font: 360 13px var(--sans); color: var(--fog); margin-left: 4px; }
.state { display: inline-flex; align-items: center; gap: 7px; font: 420 13px/1 var(--sans); padding: 8px 14px; border-radius: 40px; background: rgba(156,180,232,.2); color: var(--on-dark); }
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.state.good::before { background: var(--success-border); } .state.attn::before { background: var(--ochre); }
.state.bad { background: var(--coral); color: #fff; } .state.bad::before { background: #fff; }
.tiles { display: flex; gap: 10px; }
.tile { border-radius: var(--r-md); padding: 16px 20px; min-width: 132px; background: rgba(237,237,243,.06); border: 1px solid rgba(237,237,243,.1); }
.tile small { display: block; font: 500 11px/1 var(--sans); letter-spacing: .28px; text-transform: uppercase; color: var(--fog); margin-bottom: 10px; }
.tile b { font: 480 32px/1 var(--sans); letter-spacing: .3px; color: var(--on-dark); }
.tile .lim { display: block; font-size: 12px; margin-top: 10px; font-weight: 420; color: #8fd9b6; }
.tile.over { background: var(--coral); border-color: var(--coral); }
.tile.over b { color: #fff; }
.tile.over .lim, .tile.over small { color: #fff; }

/* tabs (dashboard + inbox): segmented, 10px radius, selected = ink */
.tabs { display: flex; gap: 6px; padding: 20px 48px 0; overflow-x: auto; scrollbar-width: none; }
.tabbtn { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 14px; padding: 0 18px; height: 40px; border-radius: 40px; }
.tabbtn.on { background: var(--primary); color: #fff; }
.tbadge { font: 420 11px/1 var(--sans); padding: 4px 8px; border-radius: 40px; background: var(--card); color: var(--ink); border: 0; }
.tabbtn.on .tbadge { background: rgba(255,255,255,.14); color: #fff; border-color: transparent; }
.tbadge.attn { background: var(--ochre-soft); border-color: var(--yellow); color: var(--ink); } .tbadge.ok { background: var(--success-bg); border-color: var(--mint); color: var(--success); }
.tbadge.crit { background: var(--coral); border-color: var(--coral); color: #fff; }
.steplist { margin: 0; padding-left: 20px; } .steplist li { padding: 3px 0; }

/* issues */
.issues-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
.issues-grid .issue { background: var(--lavender); border: 0; border-radius: var(--r-md); padding: 18px 20px; display: flex; flex-direction: column; }
.issues-grid .issue.critical { background: var(--coral-soft); border-color: var(--coral-line); }
.issue.done { opacity: .55; }
.issue .t { font-weight: 480; font-size: 16px; line-height: 1.35; color: var(--ink); display: flex; gap: 10px; align-items: flex-start; }
.issue .t .tt { flex: 1; min-width: 0; }
.issue .t::before { content: ""; flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--mustard); margin-top: 7px; }
.issue .t.sev-refer::before, .issue .t.sev-decline::before { background: var(--coral); }
.crit { flex: none; font: 500 11px/1 var(--sans); letter-spacing: .28px; text-transform: uppercase; padding: 5px 10px; border-radius: 40px; background: var(--coral); color: #fff; }
.issue p { margin: 6px 0 14px 18px; font-size: 14px; line-height: 1.45; }
.issue .row { margin: auto 0 0 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.issue .grow { flex: 1; }
.issue .row button:not(.link) { font-size: 13px; padding: 0 14px; height: 32px; background: var(--card); }
.issue .row button.dark { background: var(--primary); }

/* documents */
.docs .cardhead { margin-bottom: 0; }
.attention { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 8px; margin-top: 16px; }
.att { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--r-md); background: var(--surface-soft); border: 1px solid var(--hairline); }
.att.bad { background: var(--coral-soft); border-color: var(--coral-line); } .att.warn { background: var(--ochre-soft); border-color: #ecd58f; }
.att div { flex: 1; min-width: 0; }
.att b { display: block; font-size: 15px; }
.att span:not(.ic) { font-size: 13px; }
.att button { font-size: 13px; padding: 0 14px; height: 32px; background: var(--card); }
.ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; background: var(--success-bg); color: var(--success); }
.ic.bad { background: var(--coral); color: #fff; } .ic.warn { background: var(--ochre); color: var(--ink); } .ic.muted { background: var(--surface-strong); color: var(--muted); }
.docs .docgrid { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hairline); }
.docs.open .docgrid { display: grid; }
.docgrid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2px 16px; }
.docchip { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; border-radius: var(--r-sm); padding: 8px 10px; font-weight: 400; font-size: 14px; color: var(--ink); }
.docchip:active { background: var(--surface-soft); }

/* loan file */
.report { padding: 0; }
.rstatus { margin: 0 0 8px; font-weight: 500; color: var(--ink); }
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 32px; }
.rsec { padding: 14px 0; border-top: 1px solid var(--hairline); }
.rsec h4 { margin: 0 0 10px; font: 500 13px/1 var(--sans); color: var(--muted); }
.rsec p { margin: 0 0 6px; }
.rsec table { width: 100%; border-collapse: collapse; font-size: 14px; }
.rsec table td { border: 0; padding: 4px 8px 4px 0; vertical-align: top; }
.rsec table td:first-child { width: 38%; color: var(--muted); }
.rsec b.ok { color: var(--success); } .rsec b.over { color: var(--coral); }
.rsec ol { margin: 0; padding-left: 20px; } .rsec ol li { padding: 4px 0; }
.cond { display: flex; gap: 16px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--hairline); font-size: 15px; }
.cond:last-child { border-bottom: 0; }
.cond .ctext { flex: 1; display: flex; gap: 10px; align-items: flex-start; }
.cond .x { display: flex; gap: 12px; align-items: center; flex: none; }
.cond.removed .ctext span:last-child { text-decoration: line-through; color: var(--border-strong); }
.cond.met .ctext span:last-child { color: var(--muted); }
.cchip { flex: none; font: 420 11px/1 var(--sans); padding: 5px 9px; border-radius: 40px; background: var(--surface-soft); border: 1px solid var(--hairline); margin-top: 2px; color: var(--ink); }
.cchip.open { background: var(--ochre-soft); border-color: var(--yellow); } .cchip.met { background: var(--success-bg); border-color: var(--mint); color: var(--success); }

/* overview */
.ogrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.ogrid .ocard { margin: 0; }
.ocard.wide { grid-column: 1 / -1; }
.ocard h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font: 480 18px/1.2 var(--sans); letter-spacing: .2px; color: var(--ink); }
.oic { width: 30px; height: 30px; border-radius: 10px; background: var(--lavender); display: grid; place-items: center; font-size: 15px; }
.kvs { display: grid; gap: 12px 24px; margin: 0; }
.kvs.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kv dt { font: 500 11px/1 var(--sans); letter-spacing: .28px; text-transform: uppercase; color: var(--muted); }
.kv dd { margin: 5px 0 0; font: 480 15px/1.35 var(--sans); color: var(--ink); }
.kv dd small { display: block; font: 380 13px/1.35 var(--sans); color: var(--muted); }
.kv.bad dd { color: var(--coral); }
.person + .person { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--hairline); }
.phead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.phead > div { flex: 1; min-width: 0; }
.phead b { display: block; font-size: 16px; }
.phead small { color: var(--muted); font-size: 13px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font: 480 14px/1 var(--sans); flex: none; }
.score { text-align: center; font: 480 20px/1 var(--sans); padding: 8px 12px; border-radius: var(--r-md); background: var(--success-bg); color: var(--success); }
.score small { display: block; font: 500 10px/1 var(--sans); letter-spacing: .28px; text-transform: uppercase; margin-top: 4px; }
.score.fair { background: var(--ochre-soft); color: #8a5a00; } .score.low { background: var(--coral-soft); color: var(--coral); }
.meter { margin-bottom: 14px; }
.mtop { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.mtop span { font: 500 11px/1 var(--sans); letter-spacing: .28px; text-transform: uppercase; color: var(--muted); width: 36px; }
.mtop b { font: 480 20px/1 var(--sans); color: var(--ink); }
.mtop small { margin-left: auto; color: var(--muted); font-size: 12px; }
.mtrack { position: relative; height: 8px; border-radius: 8px; background: var(--lavender); }
.mtrack i { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: var(--success-border); }
.mtrack em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 2px; }
.meter.over .mtrack i { background: var(--coral); } .meter.over .mtop b { color: var(--coral); }
.otable { width: 100%; border-collapse: collapse; font-size: 14px; }
.otable th { font: 500 11px/1 var(--sans); letter-spacing: .28px; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0 8px 8px 0; border-bottom: 1px solid var(--hairline); }
.otable td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--hairline); color: var(--ink); }
.otable td small { display: block; color: var(--muted); font-size: 12px; }
.otag { font: 420 12px/1 var(--sans); padding: 5px 9px; border-radius: 40px; background: var(--lavender); color: var(--ink); white-space: nowrap; }
.otag.ok { background: var(--success-bg); color: var(--success); } .otag.bad { background: var(--coral-soft); color: var(--coral); }
.rental { margin-top: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--lavender); }
.rental small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.onote { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

/* broker communication */
.msg { border: 1px solid var(--hairline); border-radius: var(--r-md); margin-bottom: 12px; overflow: hidden; background: var(--card); }
details.msg > summary { list-style: none; cursor: pointer; padding: 12px 18px; background: var(--surface-soft); display: flex; gap: 10px; align-items: center; font-size: 14px; flex-wrap: wrap; color: var(--ink); font-weight: 420; }
details.msg > summary::-webkit-details-marker { display: none; }
details.msg[open] > summary { border-bottom: 1px solid var(--hairline); }
details.msg .chev { transition: transform .15s; color: var(--muted); }
details.msg:not([open]) .chev { transform: rotate(-90deg); }
.tabnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--hairline); }
.msg header { height: auto; position: static; padding: 12px 18px; background: var(--surface-soft); border: 0; border-bottom: 1px solid var(--hairline); display: flex; gap: 10px; align-items: center; font-size: 14px; flex-wrap: wrap; }
.msg pre { margin: 0; padding: 18px; white-space: pre-wrap; font: 400 15px/1.5 var(--sans); }
.msgsum { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.msgsum b { font-size: 15px; }
.msgfoot { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 12px 18px; border-top: 1px solid var(--hairline); flex-wrap: wrap; }
.msg.sent .ehead { background: var(--card); border-bottom: 1px solid var(--hairline); }
.msg.sent pre.sentbody { padding: 18px; max-height: 60vh; overflow: auto; font: 400 14px/1.6 ui-monospace, "SF Mono", Menlo, monospace; }
.pill { font: 420 12px/1 var(--sans); padding: 6px 12px; border-radius: 40px; background: var(--primary-tint-2); color: var(--ink); }
.pill.sent { background: var(--success-bg); color: var(--success); }
.sendbar { display: flex; gap: 16px; align-items: center; justify-content: space-between; margin-top: 20px; flex-wrap: wrap; }
.warn { color: #8a5a00; } .ok { color: var(--success); } .bad { color: var(--coral); }
details summary { cursor: pointer; font-weight: 480; color: var(--link); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
.log { font-size: 13px; }
.log div { padding: 5px 0; border-bottom: 1px solid var(--hairline); }

/* dialogs, email preview, toast */
dialog { border: 0; border-radius: var(--r-xl); background: var(--card); color: var(--body); padding: 0; width: min(980px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(23,23,33,.3); }
dialog.narrow { width: min(480px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(23,23,33,.6); }
dialog .body { padding: 28px; }
dialog h3 { font: 480 26px/1.2 var(--sans); letter-spacing: .4px; color: var(--ink); margin: 0 0 4px; }
.viewer { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 20px; }
.viewer iframe, .viewer img { width: 100%; height: 540px; border: 1px solid var(--hairline); border-radius: var(--r-md); object-fit: contain; background: var(--surface-soft); }
.field { padding: 8px 10px; border-radius: var(--r-sm); font-size: 14px; }
.field.hl { background: var(--hl); }
label { display: block; font: 500 13px/1 var(--sans); color: var(--ink); margin: 16px 0 6px; }
select, input, textarea { font: inherit; width: 100%; height: auto; padding: 12px 20px; border: 1px solid var(--hairline); border-radius: var(--r-md); background: var(--card); color: var(--ink); }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint-2); }
.email { margin-top: 16px; border: 1px solid var(--hairline); border-radius: var(--r-md); overflow: hidden; }
.ehead { background: var(--surface-soft); padding: 12px 18px; font-size: 14px; }
.ehead div { padding: 3px 0; display: flex; gap: 12px; }
.ehead span { width: 64px; flex: none; font: 500 13px/1.6 var(--sans); color: var(--muted); }
.email pre { margin: 0; padding: 18px; max-height: 52vh; overflow: auto; white-space: pre-wrap; font: 400 13px/1.6 ui-monospace, "SF Mono", Menlo, monospace; }
.toast { position: fixed; right: 24px; bottom: 24px; z-index: 50; background: var(--dark-2); color: #fff; font-weight: 500; font-size: 15px;
  padding: 13px 22px; border-radius: 40px; opacity: 0; transform: translateY(12px); transition: .25s; }
.toast.show { opacity: 1; transform: none; }

@media (max-width: 820px) {
  header { padding: 0 16px; }
  .tag { display: none; }
  .band, .band.slim { padding: 20px 16px; }
  .band.block { margin: 12px 12px 0; padding: 22px 18px; }
  .display { font-size: 30px; }
  .queuehead, .status { grid-template-columns: 1fr; gap: 16px; }
  .kpis div, .tile { min-width: 0; flex: 1; padding: 10px 12px; }
  .tile b { font-size: 22px; }
  .qrow { grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; }
  .qrow.qhead { display: none; }
  .qrow > span:nth-child(3), .qrow > span:nth-child(5) { grid-column: 1 / -1; }
  .qrow > span:nth-child(2), .qrow > span:nth-child(6) { display: none; }
  .cols, .viewer, .issues-grid, .attention, .ogrid, .kvs.two { grid-template-columns: 1fr; }
  .tabs { padding: 16px 12px 0; }
  .cond { flex-direction: column; gap: 8px; }
  .card, dialog .body { padding: 18px; }
  .viewer iframe, .viewer img { height: 360px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5266eb"/><path d="M21.5 10.2A8 8 0 1 0 21.5 21.8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M13 16h13" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="16" r="2.6" fill="#9cb4e8"/></svg><div><h1>Clearline</h1><small>Underwriting agent</small></div></div>
  <span class="spacer"></span>
  <button id="newBtn" onclick="startScreen()" hidden>← Dashboard</button>
</header>
<main id="app"></main>
<input type="file" id="picker" multiple hidden>
<dialog id="dlg"><div class="body" id="dlgBody"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => "$" + Number(v).toLocaleString("en-CA", {maximumFractionDigits: 0});
const sleep = ms => new Promise(r => setTimeout(r, ms));
let view = null, batch = null, samples = [], docsOpen = false, tab = null;
const tabByBatch = {};

async function api(path, body) {
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
    headers: body === undefined ? {} : {"Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await r.json();
  if (!r.ok) { alert(data.detail || "Something went wrong"); throw new Error(data.detail); }
  return data;
}

/* ---------- 1. start: applications that arrived from the broker POS ---------- */
const short = m => m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
const compact = v => v >= 1e6 ? `$${(v / 1e6).toFixed(2)}M` : `$${Math.round(v / 1e3)}K`;
const fmtDay = d => new Date(d + "T12:00").toLocaleDateString("en-CA", {month: "short", day: "numeric", year: "numeric"});
const ago = m => m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} hr ${m % 60} min ago`;
let listTab = "new";
const OUTCOME_TONE = {"Conditions sent": "attn", "Clear to approve": "ok", "Referred to senior": "attn", "Declined": "bad"};
async function startScreen(which) {
  $("#newBtn").hidden = true; view = null;
  if (which) listTab = which;
  samples = samples.length ? samples : await api("/api/samples");
  const done = await api("/api/reviewed");
  const rows = [...samples].sort((x, y) => x.pos.received_min_ago - y.pos.received_min_ago);
  const isNew = listTab === "new";
  const earliest = rows.filter(r => r.closing_date).sort((x, y) => x.closing_date.localeCompare(y.closing_date))[0];
  const avgTurn = Math.round(done.reduce((t, r) => t + r.turnaround_min, 0) / done.length);
  const hero = isNew
    ? `<div><h1 class="display">New Applications</h1><p class="lede" style="margin:0">Pick one to start a review.</p></div>
       <div class="kpis"><div><b>${rows.length}</b><span>Waiting</span></div>
         <div><b>${short(rows[rows.length - 1].pos.received_min_ago)}</b><span>Oldest waiting</span></div>
         <div><b>${compact(rows.reduce((t, r) => t + Number(r.loan_amount), 0))}</b><span>Loan volume</span></div>
         ${earliest ? `<div><b>${fmtDay(earliest.closing_date)}</b><span>Earliest closing · ${esc(earliest.pos.app_no)}</span></div>` : ""}</div>`
    : `<div><h1 class="display">Reviewed Applications</h1><p class="lede" style="margin:0">Files that have been through review.</p></div>
       <div class="kpis"><div><b>${done.length}</b><span>Reviewed</span></div>
         <div><b>${avgTurn} min</b><span>Avg. turnaround</span></div>
         <div><b>${done.filter(r => r.outcome === "Conditions sent").length}</b><span>Conditions sent</span></div></div>`;
  const src = r => `<span class="src">${esc(r.source)}</span>`;
  const newRows = rows.map(r => `<div class="qrow" role="row" onclick="sendSample('${r.id}')">
      <span><b>${esc(r.pos.app_no)}</b><small><span class="dotnew"></span>New · ${r.files.length} docs</small></span>
      <span>${src(r.pos)}</span>
      <span><b>${esc(r.borrowers.join(" & "))}</b><small>${esc(r.address)} · ${esc(r.income_type)}</small></span>
      <span><b>${money(r.loan_amount)}</b><small>of ${money(r.purchase_price)}</small></span>
      <span><b>${esc(r.pos.broker)}</b><small>${esc(r.pos.brokerage)}</small></span>
      <span><small>${ago(r.pos.received_min_ago)}</small></span>
      <span><button class="rowbtn" onclick="event.stopPropagation(); sendSample('${r.id}')">Start review</button></span></div>`).join("");
  const doneRows = done.map(r => `<div class="qrow static" role="row">
      <span><b>${esc(r.app_no)}</b><small>${esc(r.reviewed_by)} · ${r.turnaround_min} min</small></span>
      <span>${src(r)}</span>
      <span><b>${esc(r.borrowers.join(" & "))}</b><small>${esc(r.address)}</small></span>
      <span><b>${money(r.loan_amount)}</b></span>
      <span><b>${esc(r.broker)}</b><small>${esc(r.brokerage)}</small></span>
      <span><small>${r.reviewed_min_ago ? ago(r.reviewed_min_ago) : "Just now"}</small></span>
      <span><span class="outcome o-${OUTCOME_TONE[r.outcome] || "none"}">${esc(r.outcome)}</span></span></div>`).join("");
  $("#app").innerHTML = `
    <section class="band block night"><div class="inner queuehead">${hero}</div></section>
    <section class="band light tight"><div class="inner">
      <div class="listbar">
        <div class="seg" role="tablist">
          <button role="tab" aria-selected="${isNew}" class="tabbtn ${isNew ? "on" : ""}" onclick="startScreen('new')">New <span class="tbadge">${rows.length}</span></button>
          <button role="tab" aria-selected="${!isNew}" class="tabbtn ${isNew ? "" : "on"}" onclick="startScreen('reviewed')">Reviewed <span class="tbadge">${done.length}</span></button>
        </div>
        <button class="primary" onclick="$('#picker').click()">⇪ Upload Loan Application</button>
      </div>
      <div class="queue" id="drop" role="table" aria-label="${isNew ? "New applications" : "Reviewed applications"}">
        <div class="qrow qhead" role="row"><span>Application</span><span>Source</span><span>Borrower · property</span><span>Loan</span><span>Broker</span>
          <span>${isNew ? "Received" : "Reviewed"}</span><span>${isNew ? "" : "Outcome"}</span></div>
        ${isNew ? newRows : doneRows}
      </div>
    </div></section>`;
  const drop = $("#drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); uploadFiles([...e.dataTransfer.files]); };
}
$("#picker").onchange = e => { uploadFiles([...e.target.files]); e.target.value = ""; };

async function sendSample(id) {
  const s = samples.find(x => x.id === id);
  const files = await Promise.all(s.files.map(async name => {
    const blob = await (await fetch(`/samples/${id}/${encodeURIComponent(name)}`)).blob();
    return new File([blob], name, {type: blob.type});
  }));
  uploadFiles(files, s.pos);
}

/* ---------- 2. upload with progress, then the agent works ---------- */
function sendFile(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(), form = new FormData();
    form.append("file", file);
    xhr.open("POST", `/api/uploads/${batch}/files`);
    xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => xhr.status < 300 ? resolve(JSON.parse(xhr.responseText)) : reject(JSON.parse(xhr.responseText).detail);
    xhr.onerror = () => reject("Upload failed");
    xhr.send(form);
  });
}

async function uploadFiles(files, pos) {
  if (!files.length) return;
  $("#newBtn").hidden = false;
  batch = (await api("/api/uploads", {})).batch_id;
  tab = null;
  $("#app").innerHTML = `<section class="band block lavender slim"><div class="inner">
    <div class="who" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b style="font:500 22px/1.3 var(--sans)">${pos ? `${esc(pos.app_no)} · ` : ""}${files.length} documents</b><span class="muted small">${pos ? `Submitted by ${esc(pos.broker)}, ${esc(pos.brokerage)}` : "Each file is uploaded, identified and handed to the agent."}</span></div></div></section>
    <section class="band light tight"><div class="inner"><div class="cols">
    <div class="card"><h2>Files</h2><div id="files">${files.map((f, i) => `
      <div class="file" id="f${i}"><span>📄</span><div><div class="name">${esc(f.name)}</div>
      <div class="what">Waiting…</div><div class="bar"><i></i></div></div><span class="muted small">${Math.max(1, Math.round(f.size / 1024))} KB</span></div>`).join("")}</div></div>
    <div class="card"><h2>Agent</h2><ul class="steps" id="steps"><li class="now">Waiting for files…</li></ul></div></div></div></section>`;
  for (const [i, f] of files.entries()) {
    const row = $(`#f${i}`), what = $(".what", row), bar = $(".bar i", row);
    what.textContent = "Uploading…";
    try {
      const res = await sendFile(f, p => bar.style.width = `${Math.round(p * 100)}%`);
      bar.style.width = "100%"; await sleep(350);  // local uploads are instant; slow down so the step is visible
      what.innerHTML = res.recognized
        ? `<span class="ok">✓ Uploaded</span> · Identified as ${esc(res.documents.map(d => d.label).join(", "))}`
        : `<span class="warn">Uploaded · not recognized</span> (this prototype can only read its sample files)`;
    } catch (err) { what.innerHTML = `<span class="bad">✗ ${esc(err)}</span>`; }
  }
  await agentWorks();
}

async function agentWorks() {
  const steps = ["Sorting and reading documents", "Checking what's missing", "Verifying income", "Tracing deposits and down payment",
                 "Comparing debts with the credit report", "Calculating ratios against policy", "Drafting conditions and broker request"];
  const ul = $("#steps");
  let data;
  try { data = api(`/api/uploads/${batch}/review`, {}); } catch { return; }
  for (const [i, s] of steps.entries()) {
    ul.innerHTML = steps.slice(0, i + 1).map((x, j) => `<li class="${j < i ? "done" : "now"}">${x}</li>`).join("");
    await sleep(450);
  }
  try { view = await data; } catch { ul.innerHTML += `<li class="bad">Review couldn't start.</li>`; return; }
  ul.innerHTML = steps.map(x => `<li class="done">${x}</li>`).join("");
  await sleep(400);
  render();
}

/* ---------- 3. dashboard ---------- */
function headline(v) {
  const open = v.flags.filter(f => !f.dismissed);
  const needs = v.conditions.filter(c => c.raised_by && c.raised_by !== "tds_limit" && c.raised_by !== "gds_limit").length;
  if (open.some(f => f.area === "authenticity")) return ["bad", "Critical · possible fraud", ""];
  if (v.recommendation === "decline") return ["bad", "Outside policy", ""];
  if (v.recommendation === "refer_for_review") return ["attn", "Needs review", ""];
  if (v.recommendation === "approve_with_conditions") return ["attn", `${needs} condition${needs === 1 ? "" : "s"}`, ""];
  return ["good", "Clear to approve", ""];
}

function render() {
  const v = view, rv = v.review, r = v.ratios, a = v.application;
  const [tone, title, sub] = headline(v);
  const tile = (label, val, limit) => { const over = Number(val) > limit;
    return `<div class="tile ${over ? "over" : ""}"><small>${label}</small><b>${val}%</b><span class="lim">${over ? "Over" : "Within"} ${limit}% limit</span></div>`; };
  const missing = v.flags.filter(f => f.check === "missing_document");
  const issues = v.flags.filter(f => f.check !== "missing_document" && f.check !== "low_confidence");

  const issueHtml = issues.length ? `<div class="issues-grid">${issues.map(f => {
    const done = rv.flag_reviews[f.id];
    const ev = f.evidence.find(e => e.doc_id);
    const critical = f.area === "authenticity";
    return `<div class="issue ${done ? "done" : ""} ${critical ? "critical" : ""}"><div class="t sev-${f.severity}"><span class="tt">${esc(f.title)}</span>${critical ? `<span class="crit">Critical</span>` : ""}</div>
      <p>${esc(f.detail)}</p>
      <div class="row">${ev ? `<button class="link" onclick="openDoc('${ev.doc_id}','${esc(ev.field)}')">View source →</button>` : ""}
      <span class="grow"></span>
      ${done ? `<span class="small muted">${done.action === "reject" ? "✕ Dismissed" : done.action === "escalate" ? `Escalated to ${esc(f.escalate_to)}` : "✓ Kept as valid issue"}</span>
        ${rv.approved ? "" : `<button class="link" onclick="act({kind:'flag',target:'${esc(f.id)}',action:'undo'})">undo</button>`}`
      : `${f.escalate_to ? `<button onclick="act({kind:'flag',target:'${esc(f.id)}',action:'escalate'})">Escalate</button>` : ""}
         <button onclick="notIssue('${esc(f.id)}')">Dismiss</button>
         <button class="dark" onclick="act({kind:'flag',target:'${esc(f.id)}',action:'confirm'})">✓ Valid issue</button>`}</div></div>`;
  }).join("")}</div>` : `<p class="muted" style="margin:0">No issues found. Income, deposits, debts and documents all line up.</p>`;

  const lowDocs = v.documents.filter(d => d.confidence < 0.8 && !rv.confirmed_docs.includes(d.id) && !rv.declined_docs.includes(d.id));
  const declinedDocs = v.documents.filter(d => rv.declined_docs.includes(d.id));
  const unknown = v.uploads.filter(u => !u.recognized);
  const sentConds = new Set(rv.messages.flatMap(m => m.condition_ids));
  const asked = flagId => v.conditions.some(c => c.flag_id === flagId && sentConds.has(c.id));
  const attention = missing.map(f => `<div class="att bad"><span class="ic bad">✗</span><div><b>${esc(f.title.replace("Missing document: ", ""))}</b>
        <span>Missing · ${asked(f.id) ? "requested from broker" : "in the draft request below"}</span></div></div>`).join("")
    + lowDocs.map(d => `<div class="att warn"><span class="ic warn">!</span><div><b>${esc(d.label)}</b><span>Hard to read · ${asked(`low_confidence:${d.id}`) ? "clearer copy requested" : "clearer copy in the draft request"}</span></div>
        ${rv.approved ? "" : `<button onclick="openDoc('${d.id}',null,true)">Check read</button>`}</div>`).join("")
    + declinedDocs.map(d => `<div class="att bad"><span class="ic bad">✗</span><div><b>${esc(d.label)}</b><span>Read declined · clearer copy needed</span></div>
        ${rv.approved ? "" : `<button onclick="openDoc('${d.id}',null,true)">Re-check</button>`}</div>`).join("")
    + unknown.map(u => `<div class="att"><span class="ic muted">?</span><div><b>${esc(u.filename)}</b><span>${esc(u.note || "Not recognized")}</span></div></div>`).join("");
  const received = v.documents.filter(d => !lowDocs.includes(d) && !declinedDocs.includes(d)).map(d =>
    `<button class="docchip" onclick="openDoc('${d.id}')"><span class="ic">✓</span>${esc(d.label)}</button>`).join("");
  const counts = [`<span class="count ok">✓ ${v.documents.length - lowDocs.length} received</span>`,
    lowDocs.length ? `<span class="count warn">! ${lowDocs.length} hard to read</span>` : "",
    missing.length ? `<span class="count bad">✗ ${missing.length} missing</span>` : ""].join("");
  const docsHtml = `${attention ? `<div class="attention">${attention}</div>` : ""}<div class="docgrid">${received}</div>`;
  const aps = v.documents.find(d => d.type === "purchase_agreement")?.fields || {};
  const L = a.loan, P = a.property;
  const fmtDate = dt => dt ? new Date(dt + "T12:00").toLocaleDateString("en-CA", {month: "short", day: "numeric", year: "numeric"}) : "Not provided";
  const facts = [["Loan amount", money(L.amount)], ["Purchase price", money(P.purchase_price)],
    ["Down payment", money(L.down_payment), `${Math.round(L.down_payment / P.purchase_price * 100)}%`],
    ["Closing date", fmtDate(aps.closing_date)], ["Rate", `${L.contract_rate}%`, `qualifies at ${r.qualifying_rate}%`],
    ["Term · amortization", `${L.term_years} yr · ${L.amortization_years} yr`, esc(L.product)]];

  const kindLabel = k => k === "document_request" ? "Document request" : "Review report & conditions";
  const msgs = rv.messages.map((m, i) => `<details class="msg sent" ${msgOpen(`sent${i}`, false)} ontoggle="msgToggle(this, 'sent${i}')"><summary><span class="pill sent">✓ Sent</span><b>${kindLabel(m.kind)}</b><span class="muted small">to ${esc(m.to.split(" <")[0])}</span><span style="flex:1"></span><span class="muted">${esc(m.at.slice(11, 16))}</span><span class="chev">▾</span></summary>
      <div class="ehead"><div><span>From</span>${esc(m.from)}</div><div><span>To</span>${esc(m.to)}</div><div><span>Subject</span><b>${esc(m.subject)}</b></div></div>
      <pre class="sentbody">${esc(m.body)}</pre></details>`).join("");
  const req = rv.request_draft && !rv.approved ? `<details class="msg" ${msgOpen("req", true)} ontoggle="msgToggle(this, 'req')"><summary><span class="pill">Draft</span><b>Document request</b>
      <span class="muted small">${rv.request_draft.condition_ids.length} item${rv.request_draft.condition_ids.length === 1 ? "" : "s"}</span><span style="flex:1"></span><span class="chev">▾</span></summary><pre>${esc(rv.request_draft.body)}</pre>
      <div class="msgfoot"><span class="muted small">Plain document request. Can go now, before you finish reviewing.</span>
      <button class="primary" onclick="previewMsg('send_request')">Preview & send</button></div></details>` : "";
  const condRow = c => {
    const cr = rv.condition_reviews[c.id] || {}, text = cr.text || c.text;
    const state = cr.action === "reject" ? "removed" : cr.action === "fulfill" ? "met" : "open";
    const chip = {open: `<span class="cchip open">Outstanding</span>`, met: `<span class="cchip met">✓ Fulfilled</span>`,
                  removed: `<span class="cchip">Removed</span>`}[state];
    const acts = rv.approved ? "" : state === "open"
      ? `<button class="small-btn" onclick="act({kind:'condition',target:'${c.id}',action:'fulfill'})">Mark fulfilled</button>
         <button class="link" onclick="condEdit('${c.id}')">Edit</button><button class="link" onclick="condRemove('${c.id}')">Remove</button>`
      : `<button class="link" onclick="act({kind:'condition',target:'${c.id}',action:'accept'})">${state === "met" ? "Reopen" : "Restore"}</button>`;
    return `<div class="cond ${state}"><div class="ctext">${chip}<span>${esc(text)}</span></div><div class="x">${acts}</div></div>`;
  };
  const isMet = c => (rv.condition_reviews[c.id] || {}).action === "fulfill";
  const fileConds = v.conditions.filter(c => c.raised_by), fundConds = v.conditions.filter(c => !c.raised_by);
  const openCount = fileConds.filter(c => !isMet(c) && (rv.condition_reviews[c.id] || {}).action !== "reject").length;
  const metCount = v.conditions.filter(isMet).length;

  const unreviewed = issues.filter(f => !rv.flag_reviews[f.id]);
  const needsDocs = missing.length + lowDocs.length;
  if (!tab) tab = tabByBatch[batch] || (unreviewed.length ? "issues" : lowDocs.length ? "docs" : rv.approved ? "broker" : "file");   // attention first, else Overview
  const blockerHtml = rv.blockers.map(b => tabLink(b.includes("issue") ? "issues" : "docs", esc(b))).join(" and ");
  const tabs = [
    {id: "file", label: "Overview", badge: openCount ? `${openCount} outstanding` : "✓", tone: openCount ? "attn" : "ok"},
    {id: "issues", label: "Issues to Review", badge: unreviewed.length ? `${unreviewed.length} open` : issues.length ? "✓" : "None",
     tone: unreviewed.some(f => f.area === "authenticity") ? "crit" : unreviewed.length ? "attn" : "ok"},
    {id: "docs", label: "Documents", badge: needsDocs ? `${needsDocs} need attention` : `✓ ${v.documents.length}`, tone: needsDocs ? "attn" : "ok"},
    {id: "broker", label: "Broker Communication", badge: rv.approved ? "✓ Sent" : "Draft ready", tone: rv.approved ? "ok" : ""},
    {id: "activity", label: "Activity"},
  ];
  const panels = {
    issues: `<div class="card"><h2>Issues to Review <span class="muted">· ${issues.length}</span></h2>${issueHtml}
      ${issues.length && !unreviewed.length ? `<p class="small" style="margin:16px 0 0">All issues reviewed. Next: ${tabLink("file", "check the overview")} or ${tabLink("broker", "send to the broker")}.</p>` : ""}</div>`,
    docs: `<div class="card docs open"><div class="cardhead"><h2>Documents</h2><div class="counts">${counts}</div></div>${docsHtml}
      ${needsDocs ? `<p class="small" style="margin:16px 0 0">Missing and hard-to-read documents go out in the ${tabLink("broker", "document request")}.</p>` : ""}</div>`,
    file: `${overviewHtml(v, rv)}
      <div class="card ocard"><div class="cardhead"><h2>Conditions</h2><div class="counts"><span class="count bad">${openCount} outstanding</span><span class="count ok">${metCount} fulfilled</span></div></div>
        <div class="report"><div class="rsec wide"><h4>Before approval</h4>${fileConds.map(condRow).join("") || `<p class="small">None. Only the standard conditions remain.</p>`}</div>
        <div class="rsec wide"><h4>Before funding</h4>${fundConds.map(condRow).join("")}</div></div></div>`,
    broker: `<div class="card"><h2>Broker Communication</h2>${req}
      ${rv.approved ? "" : `<details class="msg" ${msgOpen("cond", true)} ontoggle="msgToggle(this, 'cond')"><summary><span class="pill">Draft</span><b>Review report & conditions</b><span class="muted small">${esc(rv.draft.status)}</span><span style="flex:1"></span><span class="chev">▾</span></summary>
        <div class="msgsum"><span>To ${esc(rv.draft.to.split(" <")[0])} · includes the file summary, qualification, ${openCount} outstanding${metCount ? ` and ${metCount} fulfilled` : ""} condition${openCount + metCount === 1 ? "" : "s"}. Conditions are edited in the ${tabLink("file", "Overview")} tab.</span></div>
        <div class="msgfoot"><span class="${rv.blockers.length ? "warn" : "muted"} small">${rv.blockers.length ? "Before sending: " + blockerHtml : "Nothing goes out until you send it."}</span>
        <button class="primary" ${rv.blockers.length ? "disabled" : ""} onclick="previewMsg('approve')">Preview & send</button></div></details>`}
      ${msgs || (rv.approved ? "" : `<p class="small muted" style="margin:4px 0 0">Nothing sent yet.</p>`)}</div>`,
    activity: `<div class="card"><h2>Figures used in the ratios</h2>
      <table>${v.inputs.map(i => `<tr><td>${esc(i.label)}<div class="muted">${esc(i.basis)}${i.override ? ` · changed from ${money(i.agent_value)}: ${esc(i.override.reason)}` : ""}</div></td>
        <td style="white-space:nowrap">${money(i.value)}</td><td>${rv.approved ? "" : `<button class="link" onclick="editInput('${esc(i.key)}','${esc(i.label)}','${i.value}')">Edit</button>`}</td></tr>`).join("")}</table>
      ${v.comparison ? `<p class="small muted">${esc(v.comparison.label)}: GDS ${v.comparison.gds}%, TDS ${v.comparison.tds}%</p>` : ""}</div>
      <div class="cols"><div class="card"><h2>What the agent did</h2><ol class="small steplist">${v.steps.map(s => `<li>${esc(s.text)}${s.detail ? ` <span class="muted">– ${esc(s.detail)}</span>` : ""}</li>`).join("")}</ol></div>
      <div class="card"><h2>Audit trail</h2><div class="log">${rv.audit.map(x => `<div><span class="muted">${esc(x.at.slice(11))}</span> <b>${esc(x.who)}</b> ${esc(x.text)}</div>`).join("")}</div>
      <p class="small muted">Policy: ${v.policy_versions.map(p => esc(p.file) + " v" + esc(p.version)).join(", ")}</p></div></div>`,
  };

  $("#app").innerHTML = `
  <section class="band block night"><div class="inner status">
    <div><div class="who"><b>${esc(a.borrowers.map(b => b.name).join(" & "))}</b><span>${esc(a.property.address)}</span>
        <span class="state ${tone}">${esc(title)}</span></div>
      <dl class="facts">${facts.map(([k, val, note]) => `<div><dt>${k}</dt><dd>${val}${note ? `<small>${note}</small>` : ""}</dd></div>`).join("")}</dl></div>
    <div class="tiles">${tile("GDS", r.gds_qualifying, v.limits.gds)}${tile("TDS", r.tds_qualifying, v.limits.tds)}${tile("LTV", r.ltv, 80)}</div>
  </div></section>
  <nav class="tabs inner" role="tablist">${tabs.map(t => `<button role="tab" aria-selected="${t.id === tab}" class="tabbtn ${t.id === tab ? "on" : ""}"
      onclick="setTab('${t.id}')">${t.label}${t.badge ? `<span class="tbadge ${t.tone || ""}">${t.badge}</span>` : ""}</button>`).join("")}</nav>
  <section class="band light tight"><div class="inner" id="tabpanel"></div></section>`;
  const at = tabs.findIndex(t => t.id === tab), prev = tabs[at - 1], next = tabs[at + 1];
  const tabNav = `<div class="tabnav">${prev ? `<button onclick="setTab('${prev.id}')">← ${prev.label}</button>` : "<span></span>"}
    <span class="muted small">${at + 1} of ${tabs.length}</span>
    ${next ? `<button class="primary" onclick="setTab('${next.id}')">${next.label} →</button>` : "<span></span>"}</div>`;
  $("#app").querySelector("#tabpanel").innerHTML = panels[tab] + tabNav;
}

const msgState = {};
const msgOpen = (key, dflt) => (msgState[batch + key] ?? dflt) ? "open" : "";
function msgToggle(el, key) { msgState[batch + key] = el.open; }

function setTab(id) { tab = id; tabByBatch[batch] = id; render(); window.scrollTo({top: 0, behavior: "smooth"}); }
const tabLink = (id, text) => `<button class="link" onclick="setTab('${id}')">${text}</button>`;

/* ---------- Overview: the file's home page ---------- */
function overviewHtml(v, rv) {
  const a = {liabilities: [], existing_properties: [], ...v.application}, L = a.loan, P = a.property, r = v.ratios, pos = v.pos || {};
  const docs = t => v.documents.filter(d => d.type === t);
  const fld = (t, k, who) => (docs(t).find(d => !who || d.fields.name === who) || {fields: {}}).fields[k];
  const pct = (x, y) => `${(Number(x) / Number(y) * 100).toFixed(0)}%`;
  const row = (k, val, note, cls = "") => val == null || val === "" ? "" :
    `<div class="kv ${cls}"><dt>${k}</dt><dd>${val}${note ? `<small>${note}</small>` : ""}</dd></div>`;
  const card = (title, icon, body, wide) => `<section class="ocard card ${wide ? "wide" : ""}"><h3><span class="oic">${icon}</span>${title}</h3>${body}</section>`;
  const bar = (label, val, limit) => { const over = Number(val) > limit, w = Math.min(100, Number(val) / (limit * 1.25) * 100);
    return `<div class="meter ${over ? "over" : ""}"><div class="mtop"><span>${label}</span><b>${val}%</b><small>limit ${limit}%</small></div>
      <div class="mtrack"><i style="width:${w}%"></i><em style="left:${100 / 1.25}%"></em></div></div>`; };
  const inputVal = key => (v.inputs.find(i => i.key === key) || {}).value;
  const incomeLabel = t => ({salary: "Salaried", self_employed: "Self-employed", hourly: "Hourly", rental: "Rental", bonus: "Bonus", commission: "Commission"}[t] || t);
  const scoreTone = s => s >= 760 ? "good" : s >= 680 ? "fair" : "low";

  const borrowers = a.borrowers.map((b, bi) => {
    const inc = b.incomes[0] || {}, q = inputVal(`income:${bi}:0`);
    const start = fld("employment_letter", "start_date", b.name) || fld("business_registration", "registered");
    const years = start ? Math.max(0, (new Date("2026-10-30") - new Date(start)) / 3.156e10).toFixed(1) : null;
    return `<div class="person"><div class="phead"><span class="avatar">${esc(b.name.split(" ").map(x => x[0]).slice(0, 2).join(""))}</span>
      <div><b>${esc(b.name)}</b><small>${esc(incomeLabel(inc.type))}${inc.employer ? " · " + esc(inc.employer) : ""}</small></div>
      ${b.credit_score ? `<span class="score ${scoreTone(b.credit_score)}">${b.credit_score}<small>credit</small></span>` : ""}</div>
      <dl class="kvs">${row("Stated income", money(inc.annual_amount))}${q && Number(q) !== Number(inc.annual_amount) ? row("Qualifying income", money(q), "used in ratios") : ""}
        ${row(inc.type === "self_employed" ? "In business since" : "Employed since", start ? fmtDay(start) : null, years ? `${years} yrs` : "")}
        ${row("Position", fld("employment_letter", "position", b.name))}</dl></div>`;
  }).join("");

  const lendingValue = Math.min(Number(P.purchase_price), Number(P.appraised_value || P.purchase_price));
  const property = `<dl class="kvs two">
      ${row("Address", esc(P.address))}${row("Type", esc(P.type.replace("_", " ")), P.living_area_sqft ? `${P.living_area_sqft} sq ft` : "")}
      ${row("Purchase price", money(P.purchase_price))}${row("Appraised value", P.appraised_value ? money(P.appraised_value) : null, fld("appraisal", "marketability") ? `${fld("appraisal", "marketability")} marketability` : "")}
      ${row("Lending value", money(lendingValue), "lower of price and appraisal")}${row("Property tax", money(P.annual_property_tax) + "/yr", money(P.annual_property_tax / 12) + "/mo")}
      ${Number(P.monthly_condo_fees) ? row("Condo fees", money(P.monthly_condo_fees) + "/mo", "50% counted in GDS") : ""}
      ${row("Heating", P.monthly_heat ? money(P.monthly_heat) + "/mo" : "$100/mo", P.monthly_heat ? "" : "policy default")}</dl>`;

  const loan = `<dl class="kvs two">
      ${row("Loan amount", money(L.amount))}${row("Down payment", money(L.down_payment), pct(L.down_payment, P.purchase_price) + " of price")}
      ${row("Product", esc(L.product), `${L.term_years}-yr term · ${L.amortization_years}-yr amortization`)}
      ${row("Contract rate", `${L.contract_rate}%`)}${row("Qualifying rate", `${r.qualifying_rate}%`, "stress test")}
      ${row("Monthly payment", money(r.monthly_payment_contract), `${money(r.monthly_payment_qualifying)} at qualifying rate`)}
      ${Number(r.insurance_premium) ? row("Insurance premium", money(r.insurance_premium), `total loan ${money(r.total_loan)}`) : row("Insurance", "Conventional", "LTV 80% or less")}
      ${row("Closing date", fmtDay(fld("purchase_agreement", "closing_date")))}</dl>`;

  const qual = `${bar("GDS", r.gds_qualifying, v.limits.gds)}${bar("TDS", r.tds_qualifying, v.limits.tds)}${bar("LTV", r.ltv, 80)}
      <dl class="kvs two" style="margin-top:14px">${row("Qualifying income", money(r.qualifying_monthly_income) + "/mo")}${row("Other debts", money(r.other_monthly_debts) + "/mo")}</dl>
      ${v.comparison ? `<p class="onote">${esc(v.comparison.label)}: GDS ${v.comparison.gds}%, TDS ${v.comparison.tds}%</p>` : ""}`;

  const bureau = (docs("credit_bureau")[0] || {fields: {tradelines: []}}).fields.tradelines;
  const declared = new Set(a.liabilities.map(l => l.lender));
  const debts = bureau.length || a.existing_properties.length ? `<table class="otable"><tr><th>Debt</th><th>Balance</th><th>Payment</th><th>Source</th></tr>
      ${bureau.map(t => `<tr><td>${esc(t.lender)}<small>${esc(t.type.replace("_", " "))}</small></td><td>${money(t.balance)}</td><td>${money(t.monthly_payment)}/mo</td>
        <td>${declared.has(t.lender) || t.type === "mortgage" ? `<span class="otag ok">Declared</span>` : `<span class="otag bad">Not declared</span>`}</td></tr>`).join("")}</table>
      ${a.existing_properties.map(p => `<div class="rental"><b>Rental · ${esc(p.address)}</b><small>Value ${money(p.value)} · mortgage ${money(p.mortgage_balance)} at ${money(p.monthly_mortgage_payment)}/mo · rent ${money(p.monthly_rental_income)}/mo (50% counted)</small></div>`).join("")}`
    : `<p class="onote">No debts on the credit report.</p>`;

  const bank = docs("bank_statement")[0];
  const deposits = bank ? bank.fields.deposits || [] : [];
  const big = deposits.filter(d => Number(d.amount) > 5000 && !/payroll|business|rent/i.test(d.description));
  const funds = `<dl class="kvs two">${row("Down payment needed", money(L.down_payment))}
      ${row("Bank balance", bank ? money(bank.fields.closing_balance) : null, bank ? esc(bank.fields.period) : "")}
      ${row("Covers down payment", bank ? (Number(bank.fields.closing_balance) >= Number(L.down_payment) ? "Yes" : "No") : null, bank ? `with ${money(Number(bank.fields.closing_balance) - Number(L.down_payment))} to spare` : "")}
      ${row("Large deposits", big.length ? `${big.length} unexplained` : "None", big.map(d => `${money(d.amount)} on ${fmtDay(d.date)}`).join(", "), big.length ? "bad" : "")}</dl>`;

  const broker = `<dl class="kvs two">${row("Application", esc(pos.app_no || "Uploaded manually"))}${row("Source", pos.source ? `<span class="otag">${esc(pos.source)}</span>` : "Upload")}
      ${row("Broker", esc(pos.broker || "—"), esc(pos.brokerage || ""))}${row("Received", pos.received_min_ago != null ? ago(pos.received_min_ago) : "Just now")}</dl>`;

  return `<div class="ogrid">
    ${card(`Borrower${a.borrowers.length > 1 ? "s" : ""}`, "👤", borrowers)}
    ${card("Qualification", "📊", qual)}
    ${card("Loan", "🏦", loan)}
    ${card("Property", "🏠", property)}
    ${card("Debts", "💳", debts)}
    ${card("Down payment & funds", "💰", funds)}
    ${card("Broker & source", "📨", broker, true)}
  </div>`;
}

/* ---------- actions ---------- */
/* broker report: same structure the email is built from */
function reportStatus(status) { return `<div class="rstatus">${esc(status)}</div>`; }
function reportSections(report) {
  return `<div class="rgrid">${report.filter(sec => sec.rows).map(sec => `<div class="rsec"><h4>${esc(sec.title)}</h4>
    ${sec.note ? `<p class="muted small">${esc(sec.note)}</p>` : ""}
    <table>${sec.rows.map(row => `<tr><td>${esc(row.label)}</td><td><b class="${row.status || ""}">${esc(row.value)}${row.status === "ok" ? " ✓" : row.status === "over" ? " ✗" : ""}</b>
      ${row.note ? `<div class="muted small">${esc(row.note)}</div>` : ""}</td></tr>`).join("")}</table></div>`).join("")}</div>`;
}
function reportConditions(report) {
  return report.filter(sec => sec.items).map(sec => `<div class="rsec wide"><h4>${esc(sec.title)}</h4>${sec.items.length
    ? `<ol>${sec.items.map(i => `<li>${esc(i.text)}${i.requested_earlier ? ` <span class="muted small">(requested earlier)</span>` : ""}</li>`).join("")}</ol>`
    : `<p class="muted small">${esc(sec.empty || "None.")}</p>`}</div>`).join("");
}

async function act(body) { view = await api(`/api/uploads/${batch}/action`, body); render(); }

function previewMsg(kind) {
  const m = kind === "send_request" ? view.review.request_draft : view.review.draft;
  const label = kind === "send_request" ? "Document request" : "Review report & conditions";
  const d = $("#dlg"); d.className = "";
  $("#dlgBody").innerHTML = `<h3>Preview: ${label}</h3><p class="muted small" style="margin:0">This is exactly what the broker will receive.</p>
    <div class="email">
      <div class="ehead"><div><span>From</span>${esc(m.from)}</div><div><span>To</span>${esc(m.to)}</div><div><span>Subject</span><b>${esc(m.subject)}</b></div></div>
      <pre>${esc(m.body)}</pre>
    </div>
    <div class="sendbar"><span class="muted small">${m.condition_ids.length} item${m.condition_ids.length === 1 ? "" : "s"} · sent to the simulated broker inbox</span>
      <span><button id="pBack">Back to edit</button> <button class="primary" id="pSend">Send</button></span></div>`;
  d.showModal();
  $("#pBack").onclick = () => d.close();
  $("#pSend").onclick = async () => {
    const btn = $("#pSend"); btn.disabled = true; btn.textContent = "Sending…";
    try { await act({kind}); } catch { btn.disabled = false; btn.textContent = "Send"; return; }
    d.close();
    toast(`✓ ${label} sent to ${m.to.split(" <")[0]}`);
  };
}

function toast(text) {
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3200);
}

function ask(title, {value, multiline, needsValue} = {}) {
  return new Promise(resolve => {
    const d = $("#dlg"); d.className = "narrow";
    $("#dlgBody").innerHTML = `<h3>${esc(title)}</h3>
      ${needsValue ? `<label>New value</label>${multiline ? `<textarea id="dv" rows="4">${esc(value)}</textarea>` : `<input id="dv" value="${esc(value)}">`}` : ""}
      <label>Reason (saved to the audit trail)</label><select id="dr">${view.review.reason_codes.map(c => `<option>${esc(c)}</option>`).join("")}</select>
      <label>Note (optional)</label><input id="dn">
      <div class="sendbar"><span></span><span><button id="dc">Cancel</button> <button class="primary" id="dk">Save</button></span></div>`;
    d.showModal();
    $("#dc").onclick = () => { d.close(); resolve(null); };
    $("#dk").onclick = () => { const n = $("#dn").value.trim(); d.close();
      resolve({value: needsValue ? $("#dv").value : null, reason: $("#dr").value + (n ? ": " + n : "")}); };
  });
}
async function notIssue(id) { const a = await ask("Dismiss this issue"); if (a) act({kind: "flag", target: id, action: "reject", reason: a.reason}); }
async function editInput(key, label, value) {
  const a = await ask(`Edit: ${label}`, {value, needsValue: true});
  if (a) act({kind: "override", target: key, value: a.value.replace(/[$,\s]/g, ""), reason: a.reason});
}
async function condRemove(id) { const a = await ask("Remove this condition"); if (a) act({kind: "condition", target: id, action: "reject", reason: a.reason}); }
async function condEdit(id) {
  const c = view.conditions.find(x => x.id === id), cr = view.review.condition_reviews[id];
  const a = await ask("Edit condition", {value: cr?.text || c.text, multiline: true, needsValue: true});
  if (a) act({kind: "condition", target: id, action: "edit", value: a.value, reason: a.reason});
}

function openDoc(id, field, confirming) {
  const d = view.documents.find(x => x.id === id);
  const src = `/samples/${view.case_id}/${encodeURIComponent(d.filename)}`;
  const isImg = /\.(jpe?g|png)$/i.test(d.filename);
  const fields = Object.entries(d.fields).map(([k, v]) => {
    const val = Array.isArray(v) ? v.map(x => typeof x === "object" ? Object.values(x).join(" · ") : x).join("<br>")
      : typeof v === "object" ? Object.entries(v).map(([p, q]) => `${esc(p)}: ${esc(q)}`).join("<br>") : esc(v);
    return `<div class="field ${k === field ? "hl" : ""}"><b>${esc(k.replace(/_/g, " "))}</b><br>${val}</div>`;
  }).join("");
  const dlg = $("#dlg"); dlg.className = "";
  $("#dlgBody").innerHTML = `<h3>${esc(d.label)}</h3><div class="muted small">${esc(d.filename)} · page ${d.page} · read with ${Math.round(d.confidence * 100)}% confidence${d.quality_note ? " · " + esc(d.quality_note) : ""}</div>
    <div class="viewer">${isImg ? `<img src="${src}" alt="${esc(d.label)}">` : `<iframe src="${src}#page=${d.page}" title="${esc(d.label)}"></iframe>`}
      <div><h2>What the agent read</h2>${fields}${field === "pdf_metadata" && d.pdf_metadata ? `<div class="field hl"><b>file metadata</b><br>${esc(d.pdf_metadata.producer)}, edited ${esc(d.pdf_metadata.modified)}</div>` : ""}
      ${d.hidden_text ? `<div class="field ${field === "hidden_text" ? "hl" : ""}"><b>hidden text (invisible on the page)</b><br>${esc(d.hidden_text)}</div>` : ""}</div></div>
    <div class="sendbar"><span class="small muted">${confirming ? "Do the values the agent read match the document?" : ""}</span>
      <span>${confirming ? `<button class="primary" id="dok">Approve</button> <button id="dno">Decline</button> ` : ""}<button id="dx">Close</button></span></div>`;
  dlg.showModal();
  $("#dx").onclick = () => dlg.close();
  if (confirming) {
    $("#dok").onclick = () => { dlg.close(); act({kind: "confirm_doc", target: id, action: "approve"}); };
    $("#dno").onclick = async () => { dlg.close(); const a = await ask("Decline the agent's read");
      if (a) act({kind: "confirm_doc", target: id, action: "decline", reason: a.reason}); };
  }
}

startScreen();
</script>
</body>
</html>
