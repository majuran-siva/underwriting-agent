<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Underwriting Agent</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #fff; --ink: #1b1f24; --muted: #646d79; --line: #e3e6eb;
  --accent: #2357d9; --accent-ink: #fff; --accent-bg: #eef3ff;
  --ok: #17784a; --ok-bg: #e5f4ec; --warn: #8f5b00; --warn-bg: #fdf3e0; --bad: #b42318; --bad-bg: #fdeceb; --hl: #fff2a8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101317; --panel: #191d23; --ink: #e8ebef; --muted: #9aa3ae; --line: #2b3139;
    --accent: #7aa2ff; --accent-ink: #0d1117; --accent-bg: #1b2540;
    --ok: #5fcb92; --ok-bg: #15291e; --warn: #e8b660; --warn-bg: #2c2412; --bad: #ff8b80; --bad-bg: #321a18; --hl: #5a4d12; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; }
header .spacer { flex: 1; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 10px 18px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; }
button.link:hover { text-decoration: underline; }

/* start */
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 48px 20px; text-align: center; background: var(--panel); cursor: pointer; transition: .15s; }
.drop.over, .drop:hover { border-color: var(--accent); background: var(--accent-bg); }
.drop .big { font-size: 20px; font-weight: 600; margin: 8px 0 4px; }
.samples { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.sample { text-align: left; padding: 12px 14px; border-radius: 10px; }
.sample b { display: block; font-size: 14px; }
.sample span { font-size: 13px; color: var(--muted); }

/* upload */
.file { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.file .name { font-weight: 500; }
.file .what { font-size: 13px; color: var(--muted); }
.bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s; }
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { padding: 6px 0; color: var(--muted); }
.steps li.done { color: var(--ink); }
.steps li.done::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.steps li.now::before { content: "◌ "; color: var(--accent); }

/* dashboard */
.status { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
.status .headline { font-size: 24px; font-weight: 700; margin: 2px 0; }
.status .headline.good { color: var(--ok); } .status .headline.attn { color: var(--warn); } .status .headline.bad { color: var(--bad); }
.tiles { display: flex; gap: 10px; flex-wrap: wrap; }
.tile { border-radius: 10px; padding: 10px 14px; min-width: 104px; background: var(--ok-bg); }
.tile.over { background: var(--bad-bg); }
.tile small { display: block; font-size: 12px; color: var(--muted); }
.tile b { font-size: 22px; }
.tile.over b { color: var(--bad); }
.cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.issue { padding: 12px 0; border-bottom: 1px solid var(--line); }
.issue:last-child { border-bottom: 0; }
.issue .t { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--warn); display: inline-block; }
.dot.refer, .dot.decline { background: var(--bad); }
.issue p { margin: 4px 0 8px 17px; font-size: 13px; color: var(--muted); }
.issue .row { margin-left: 17px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.issue.done { opacity: .6; }
.doc { display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 14px; }
.doc .ic { width: 18px; text-align: center; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.msg { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.msg header { padding: 8px 12px; background: var(--bg); border: 0; display: flex; gap: 8px; font-size: 13px; }
.msg pre { margin: 0; padding: 12px; white-space: pre-wrap; font: 14px/1.5 system-ui, sans-serif; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-bg); color: var(--accent); }
.pill.auto { background: var(--warn-bg); color: var(--warn); }
.pill.sent { background: var(--ok-bg); color: var(--ok); }
.cond { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.cond .x { margin-left: auto; white-space: nowrap; }
.cond.off span { text-decoration: line-through; color: var(--muted); }
.sendbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; }
details { margin-top: 4px; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.log { font-size: 13px; }
.log div { padding: 3px 0; border-bottom: 1px dashed var(--line); }

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(960px, calc(100vw - 32px)); }
dialog.narrow { width: min(480px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .body { padding: 18px; }
dialog h3 { margin: 0 0 4px; }
.viewer { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-top: 12px; }
.viewer iframe, .viewer img { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: 8px; object-fit: contain; background: #fff; }
.field { padding: 4px 6px; border-radius: 4px; font-size: 13px; }
.field.hl { background: var(--hl); outline: 1px solid var(--warn); }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
select, input, textarea { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
@media (max-width: 820px) {
  .cols, .viewer { grid-template-columns: 1fr; }
  .wrap { padding: 16px; }
  .viewer iframe, .viewer img { height: 360px; }
}
</style>
</head>
<body>
<header>
  <h1>Underwriting Agent</h1><span class="muted small">Maple Ridge Mortgage Co.</span>
  <span class="spacer"></span><span class="tag">SYNTHETIC DATA – PROTOTYPE</span>
  <button id="newBtn" onclick="startScreen()" hidden>New file</button>
</header>
<div class="wrap" id="app"></div>
<input type="file" id="picker" multiple hidden>
<dialog id="dlg"><div class="body" id="dlgBody"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => "$" + Number(v).toLocaleString("en-CA", {maximumFractionDigits: 0});
const sleep = ms => new Promise(r => setTimeout(r, ms));
let view = null, batch = null, samples = [];

async function api(path, body) {
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
    headers: body === undefined ? {} : {"Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await r.json();
  if (!r.ok) { alert(data.detail || "Something went wrong"); throw new Error(data.detail); }
  return data;
}

/* ---------- 1. start: drop zone + samples ---------- */
async function startScreen() {
  $("#newBtn").hidden = true; view = null;
  samples = samples.length ? samples : await api("/api/samples");
  $("#app").innerHTML = `
    <div class="drop" id="drop" onclick="$('#picker').click()">
      <div style="font-size:34px">📥</div>
      <div class="big">Drop a loan file here</div>
      <div class="muted">Drag in the application documents (PDFs and photos), or click to choose files.<br>
      Sample files are in the project's <code>samples/</code> folder.</div>
    </div>
    <h2 style="margin-top:28px">Or send in a sample file</h2>
    <div class="samples">${samples.map(s => `<button class="sample" onclick="sendSample('${s.id}')"><b>${esc(s.title)}</b>
      <span>${s.files.length} files · ${esc(s.summary)}</span></button>`).join("")}</div>`;
  const drop = $("#drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); uploadFiles([...e.dataTransfer.files]); };
}
$("#picker").onchange = e => { uploadFiles([...e.target.files]); e.target.value = ""; };

async function sendSample(id) {
  const s = samples.find(x => x.id === id);
  const files = await Promise.all(s.files.map(async name => {
    const blob = await (await fetch(`/samples/${id}/${encodeURIComponent(name)}`)).blob();
    return new File([blob], name, {type: blob.type});
  }));
  uploadFiles(files);
}

/* ---------- 2. upload with progress, then the agent works ---------- */
function sendFile(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(), form = new FormData();
    form.append("file", file);
    xhr.open("POST", `/api/uploads/${batch}/files`);
    xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => xhr.status < 300 ? resolve(JSON.parse(xhr.responseText)) : reject(JSON.parse(xhr.responseText).detail);
    xhr.onerror = () => reject("Upload failed");
    xhr.send(form);
  });
}

async function uploadFiles(files) {
  if (!files.length) return;
  $("#newBtn").hidden = false;
  batch = (await api("/api/uploads", {})).batch_id;
  $("#app").innerHTML = `<div class="cols">
    <div class="card"><h2>Uploading ${files.length} files</h2><div id="files">${files.map((f, i) => `
      <div class="file" id="f${i}"><span>📄</span><div><div class="name">${esc(f.name)}</div>
      <div class="what">Waiting…</div><div class="bar"><i></i></div></div><span class="muted small">${Math.max(1, Math.round(f.size / 1024))} KB</span></div>`).join("")}</div></div>
    <div class="card"><h2>Agent</h2><ul class="steps" id="steps"><li class="now">Waiting for files…</li></ul></div></div>`;
  for (const [i, f] of files.entries()) {
    const row = $(`#f${i}`), what = $(".what", row), bar = $(".bar i", row);
    what.textContent = "Uploading…";
    try {
      const res = await sendFile(f, p => bar.style.width = `${Math.round(p * 100)}%`);
      bar.style.width = "100%"; await sleep(350);  // local uploads are instant; slow down so the step is visible
      what.innerHTML = res.recognized
        ? `<span class="ok">✓ Uploaded</span> · Identified as ${esc(res.documents.map(d => d.label).join(", "))}`
        : `<span class="warn">Uploaded · not recognized</span> (this prototype can only read its sample files)`;
    } catch (err) { what.innerHTML = `<span class="bad">✗ ${esc(err)}</span>`; }
  }
  await agentWorks();
}

async function agentWorks() {
  const steps = ["Sorting and reading documents", "Checking what's missing", "Verifying income", "Tracing deposits and down payment",
                 "Comparing debts with the credit report", "Calculating ratios against policy", "Drafting conditions and broker request"];
  const ul = $("#steps");
  let data;
  try { data = api(`/api/uploads/${batch}/review`, {}); } catch { return; }
  for (const [i, s] of steps.entries()) {
    ul.innerHTML = steps.slice(0, i + 1).map((x, j) => `<li class="${j < i ? "done" : "now"}">${x}</li>`).join("");
    await sleep(450);
  }
  try { view = await data; } catch { ul.innerHTML += `<li class="bad">Review couldn't start.</li>`; return; }
  ul.innerHTML = steps.map(x => `<li class="done">${x}</li>`).join("");
  await sleep(400);
  render();
}

/* ---------- 3. dashboard ---------- */
function headline(v) {
  const open = v.flags.filter(f => !f.dismissed);
  const needs = v.conditions.filter(c => c.raised_by && c.raised_by !== "tds_limit" && c.raised_by !== "gds_limit").length;
  if (v.recommendation === "decline") return ["bad", "Outside policy", "The file breaks a policy limit by more than the exception margin."];
  if (v.recommendation === "refer_for_review") return ["attn", `Needs your judgment · ${open.filter(f => f.severity !== "condition").length} issue(s)`, "The agent found things a person should decide on."];
  if (v.recommendation === "approve_with_conditions") return ["attn", `Needs ${needs} thing${needs === 1 ? "" : "s"} from the broker`, "Within policy once the items below are received."];
  return ["good", "Ready to approve", "Everything checks out. Only standard conditions remain."];
}

function render() {
  const v = view, rv = v.review, r = v.ratios, a = v.application;
  const [tone, title, sub] = headline(v);
  const tile = (label, val, limit) => `<div class="tile ${limit && Number(val) > limit ? "over" : ""}"><small>${label}${limit ? ` · max ${limit}%` : ""}</small><b>${val}%</b></div>`;
  const missing = v.flags.filter(f => f.check === "missing_document");
  const issues = v.flags.filter(f => f.check !== "missing_document" && f.check !== "low_confidence");

  const issueHtml = issues.map(f => {
    const done = rv.flag_reviews[f.id];
    const ev = f.evidence.find(e => e.doc_id);
    return `<div class="issue ${done ? "done" : ""}"><div class="t"><span class="dot ${f.severity}"></span>${esc(f.title)}</div>
      <p>${esc(f.detail)}</p>
      <div class="row">${ev ? `<button class="link" onclick="openDoc('${ev.doc_id}','${esc(ev.field)}')">View source →</button>` : ""}
      ${done ? `<span class="small muted">· ${done.action === "reject" ? "Marked not an issue" : done.action === "escalate" ? `Escalated to ${esc(f.escalate_to)}` : "Confirmed"}</span>
        ${rv.approved ? "" : `<button class="link" onclick="act({kind:'flag',target:'${esc(f.id)}',action:'undo'})">undo</button>`}`
      : `<button onclick="act({kind:'flag',target:'${esc(f.id)}',action:'confirm'})">✓ Confirm</button>
         <button onclick="notIssue('${esc(f.id)}')">Not an issue</button>
         ${f.escalate_to ? `<button onclick="act({kind:'flag',target:'${esc(f.id)}',action:'escalate'})">Escalate</button>` : ""}`}</div></div>`;
  }).join("") || `<p class="muted">No issues found. Income, deposits, debts and documents all line up.</p>`;

  const docsHtml = v.documents.map(d => {
    const low = d.confidence < 0.8, conf = rv.confirmed_docs.includes(d.id);
    return `<div class="doc"><span class="ic ${low && !conf ? "warn" : "ok"}">${low && !conf ? "!" : "✓"}</span>
      <button class="link" style="color:var(--ink);font-size:14px" onclick="openDoc('${d.id}')">${esc(d.label)}</button>
      ${low && !conf && !rv.approved ? `<button class="link" onclick="openDoc('${d.id}',null,true)">Hard to read · confirm</button>` : ""}</div>`;
  }).join("") + missing.map(f => `<div class="doc"><span class="ic bad">✗</span><span>${esc(f.title.replace("Missing document: ", ""))} <span class="small bad">missing</span></span>
<span class="small muted">· requested</span></div>`).join("")
    + v.uploads.filter(u => !u.recognized).map(u => `<div class="doc"><span class="ic muted">?</span><span class="muted">${esc(u.filename)} · ${esc(u.note || "not recognized")}</span></div>`).join("");

  const msgs = rv.messages.map(m => `<div class="msg"><header><span class="pill ${m.from.startsWith("Agent") ? "auto" : "sent"}">${m.from.startsWith("Agent") ? "Sent automatically by agent" : "Sent by underwriter"}</span>
      <b>${esc(m.subject)}</b><span class="spacer" style="flex:1"></span><span class="muted">${esc(m.at.slice(11, 16))}</span></header><pre>${esc(m.body)}</pre></div>`).join("");
  const conds = v.conditions.map(c => {
    const cr = rv.condition_reviews[c.id] || {};
    const text = cr.action === "edit" ? cr.text : c.text;
    return `<div class="cond ${cr.action === "reject" ? "off" : ""}"><span>${c.raised_by ? "" : `<span class="muted small">Standard · </span>`}${esc(text)}</span>
      ${rv.approved ? "" : `<span class="x">${cr.action === "reject" ? `<button class="link" onclick="act({kind:'condition',target:'${c.id}',action:'accept'})">restore</button>`
        : `<button class="link" onclick="condEdit('${c.id}')">edit</button> · <button class="link" onclick="condRemove('${c.id}')">remove</button>`}</span>`}</div>`;
  }).join("");

  $("#app").innerHTML = `
  <div class="card status">
    <div><div class="muted small">${esc(a.borrowers.map(b => b.name).join(" & "))} · ${esc(a.property.address)} · ${money(a.loan.amount)}</div>
      <div class="headline ${tone}">${esc(title)}</div><div class="muted">${esc(sub)}</div></div>
    <div class="tiles">${tile("GDS", r.gds_qualifying, v.limits.gds)}${tile("TDS", r.tds_qualifying, v.limits.tds)}${tile("LTV", r.ltv, 80)}</div>
  </div>
  <div class="cols">
    <div class="card"><h2>Issues found (${issues.length})</h2>${issueHtml}</div>
    <div class="card"><h2>Documents · ${v.documents.length} received${missing.length ? `, ${missing.length} missing` : ""}</h2>${docsHtml}</div>
  </div>
  <div class="card"><h2>Broker</h2>${msgs}
    ${rv.approved ? "" : `<div class="msg"><header><span class="pill">Draft · waiting for you</span><b>${esc(rv.draft.subject)}</b></header>
      <div style="padding:8px 12px">${conds}</div></div>
      <div class="sendbar"><span class="${rv.blockers.length ? "warn" : "muted"} small">${rv.blockers.length ? "Before sending: " + rv.blockers.map(esc).join(" and ") : "The agent drafted this message. Nothing is sent until you approve."}</span>
      <button class="primary" ${rv.blockers.length ? "disabled" : ""} onclick="act({kind:'approve'})">Approve & send to broker</button></div>`}
  </div>
  <div class="card"><details><summary>Details: figures used, agent steps, audit trail</summary>
    <h2 style="margin-top:14px">Figures used in the ratios</h2>
    <table>${v.inputs.map(i => `<tr><td>${esc(i.label)}<div class="muted">${esc(i.basis)}${i.override ? ` · changed from ${money(i.agent_value)}: ${esc(i.override.reason)}` : ""}</div></td>
      <td style="white-space:nowrap">${money(i.value)}</td><td>${rv.approved ? "" : `<button class="link" onclick="editInput('${esc(i.key)}','${esc(i.label)}','${i.value}')">edit</button>`}</td></tr>`).join("")}</table>
    ${v.comparison ? `<p class="small muted">${esc(v.comparison.label)}: GDS ${v.comparison.gds}%, TDS ${v.comparison.tds}%</p>` : ""}
    <h2 style="margin-top:14px">What the agent did</h2><ol class="small">${v.steps.map(s => `<li>${esc(s.text)}${s.detail ? ` <span class="muted">– ${esc(s.detail)}</span>` : ""}</li>`).join("")}</ol>
    <h2 style="margin-top:14px">Audit trail</h2><div class="log">${rv.audit.map(x => `<div><span class="muted">${esc(x.at.slice(11))}</span> <b>${esc(x.who)}</b> ${esc(x.text)}</div>`).join("")}</div>
    <p class="small muted">Policy: ${v.policy_versions.map(p => esc(p.file) + " v" + esc(p.version)).join(", ")}</p>
  </details></div>`;
}

/* ---------- actions ---------- */
async function act(body) { view = await api(`/api/uploads/${batch}/action`, body); render(); }

function ask(title, {value, multiline, needsValue} = {}) {
  return new Promise(resolve => {
    const d = $("#dlg"); d.className = "narrow";
    $("#dlgBody").innerHTML = `<h3>${esc(title)}</h3>
      ${needsValue ? `<label>New value</label>${multiline ? `<textarea id="dv" rows="4">${esc(value)}</textarea>` : `<input id="dv" value="${esc(value)}">`}` : ""}
      <label>Reason (saved to the audit trail)</label><select id="dr">${view.review.reason_codes.map(c => `<option>${esc(c)}</option>`).join("")}</select>
      <label>Note (optional)</label><input id="dn">
      <div class="sendbar"><span></span><span><button id="dc">Cancel</button> <button class="primary" id="dk">Save</button></span></div>`;
    d.showModal();
    $("#dc").onclick = () => { d.close(); resolve(null); };
    $("#dk").onclick = () => { const n = $("#dn").value.trim(); d.close();
      resolve({value: needsValue ? $("#dv").value : null, reason: $("#dr").value + (n ? ": " + n : "")}); };
  });
}
async function notIssue(id) { const a = await ask("Not an issue"); if (a) act({kind: "flag", target: id, action: "reject", reason: a.reason}); }
async function editInput(key, label, value) {
  const a = await ask(`Edit: ${label}`, {value, needsValue: true});
  if (a) act({kind: "override", target: key, value: a.value.replace(/[$,\s]/g, ""), reason: a.reason});
}
async function condRemove(id) { const a = await ask("Remove this condition"); if (a) act({kind: "condition", target: id, action: "reject", reason: a.reason}); }
async function condEdit(id) {
  const c = view.conditions.find(x => x.id === id), cr = view.review.condition_reviews[id];
  const a = await ask("Edit condition", {value: cr?.text || c.text, multiline: true, needsValue: true});
  if (a) act({kind: "condition", target: id, action: "edit", value: a.value, reason: a.reason});
}

function openDoc(id, field, confirming) {
  const d = view.documents.find(x => x.id === id);
  const src = `/samples/${view.case_id}/${encodeURIComponent(d.filename)}`;
  const isImg = /\.(jpe?g|png)$/i.test(d.filename);
  const fields = Object.entries(d.fields).map(([k, v]) => {
    const val = Array.isArray(v) ? v.map(x => typeof x === "object" ? Object.values(x).join(" · ") : x).join("<br>")
      : typeof v === "object" ? Object.entries(v).map(([p, q]) => `${esc(p)}: ${esc(q)}`).join("<br>") : esc(v);
    return `<div class="field ${k === field ? "hl" : ""}"><b>${esc(k.replace(/_/g, " "))}</b><br>${val}</div>`;
  }).join("");
  const dlg = $("#dlg"); dlg.className = "";
  $("#dlgBody").innerHTML = `<h3>${esc(d.label)}</h3><div class="muted small">${esc(d.filename)} · page ${d.page} · read with ${Math.round(d.confidence * 100)}% confidence${d.quality_note ? " · " + esc(d.quality_note) : ""}</div>
    <div class="viewer">${isImg ? `<img src="${src}" alt="${esc(d.label)}">` : `<iframe src="${src}#page=${d.page}" title="${esc(d.label)}"></iframe>`}
      <div><h2>What the agent read</h2>${fields}${field === "pdf_metadata" && d.pdf_metadata ? `<div class="field hl"><b>file metadata</b><br>${esc(d.pdf_metadata.producer)}, edited ${esc(d.pdf_metadata.modified)}</div>` : ""}
      ${d.hidden_text ? `<div class="field ${field === "hidden_text" ? "hl" : ""}"><b>hidden text (invisible on the page)</b><br>${esc(d.hidden_text)}</div>` : ""}</div></div>
    <div class="sendbar"><span></span><span>${confirming ? `<button class="primary" id="dok">Values match the document</button> ` : ""}<button id="dx">Close</button></span></div>`;
  dlg.showModal();
  $("#dx").onclick = () => dlg.close();
  if (confirming) $("#dok").onclick = async () => {
dlg.close(); act({kind: "confirm_doc", target: id}); };
}

startScreen();
</script>
</body>
</html>
